name: Probe repository clasp secret

on:
  push:
    branches:
      - automation/deploy-on-green-main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check repository secret availability
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON is not available outside the protected environment."
            exit 2
          fi
          echo "Repository-level clasp secret is available."
