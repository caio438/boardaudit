name: Promote approved revision to main

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch containing the approved commit
        required: true
        type: string
      commit_sha:
        description: Exact 40-character commit SHA to promote
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate branch and exact commit
        id: target
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          git check-ref-format --branch "$TARGET_BRANCH"
          if [[ "$TARGET_BRANCH" == "main" || "$TARGET_BRANCH" == refs/* || "$TARGET_BRANCH" == -* ]]; then
            echo "::error::Informe um branch de origem diferente de main."
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_sha deve ser um SHA Git completo de 40 caracteres."
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          branch_sha="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH^{commit}")"
          target_sha="$(git rev-parse "$TARGET_SHA^{commit}")"
          if [[ "$branch_sha" != "$target_sha" ]]; then
            echo "::error::O SHA informado não é a ponta atual do branch $TARGET_BRANCH."
            echo "BRANCH_SHA=$branch_sha"
            echo "TARGET_SHA=$target_sha"
            exit 1
          fi

          base_sha="$(git rev-parse refs/remotes/origin/main)"
          echo "branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Build the exact merge candidate
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach refs/remotes/origin/main
          git merge --no-ff --no-commit "$TARGET_SHA"
          git rev-parse -q --verify MERGE_HEAD >/dev/null || {
            echo "::error::O commit já está contido em main ou não produziu um merge promovível."
            exit 1
          }
          echo "Candidato preparado: main + $TARGET_BRANCH@$TARGET_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test exact merge result
        run: npm test

      - name: Promote tested result to main
        shell: bash
        env:
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$current_main" != "$BASE_SHA" ]]; then
            echo "::error::main mudou durante a validação. Execute a promoção novamente para testar o novo merge."
            echo "TESTED_MAIN=$BASE_SHA"
            echo "CURRENT_MAIN=$current_main"
            exit 1
          fi

          git commit -m "Promote $TARGET_BRANCH at ${TARGET_SHA:0:12}"
          merge_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/main"
          echo "PROMOTED_TARGET_SHA=$TARGET_SHA"
          echo "PROMOTED_MAIN_SHA=$merge_sha"
          echo "O workflow Deploy Apps Script automatically assumirá o deploy após a validação de main."
