name: Board Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  control:
    if: >
      github.event.issue.number == 142 &&
      github.event.comment.user.login == 'caio438' &&
      startsWith(github.event.comment.body, '/board ')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read command
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          echo "BOARD_COMMAND=$COMMAND"
          echo "$COMMAND" > /tmp/board-command.txt

      - name: Confirm command received
        uses: actions/github-script@v7
        with:
          script: |
            const command = context.payload.comment.body;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 142,
              body: [
                '## Board Control',
                '',
                'Comando recebido:',
                '`' + command + '`',
                '',
                'Status: **RECEBIDO**',
                '',
                'A esteira de implementação será conectada a este comando.'
              ].join('\n')
            });
