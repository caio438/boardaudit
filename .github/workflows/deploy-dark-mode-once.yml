name: Deploy dark mode safely from production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    if: "${{ startsWith(github.event.head_commit.message, 'Deploy: modo noturno') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apps-script-production
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository tooling
        run: npm test

      - name: Configure clasp authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Pull current production source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/boardaudit-production
          mkdir -p /tmp/boardaudit-production
          cat > /tmp/boardaudit-production/.clasp.json <<'JSON'
          {
            "scriptId": "1-eZr8B0D-PdnQVFh9Qnv2GV23WvQVxa42tlQ-lVknfWbYaz8QpBM4rJ9",
            "rootDir": "."
          }
          JSON
          cd /tmp/boardaudit-production
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" pull
          rm -f .clasp.json
          find . -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Save production snapshot before overlay
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-production-before-overlay-${{ github.run_id }}
          path: /tmp/boardaudit-production
          if-no-files-found: error
          retention-days: 3

      - name: Record protected file hashes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/boardaudit-production
          find . -maxdepth 1 -type f \
            ! -name 'Index.html' \
            ! -name 'Código.js' \
            ! -name 'Code.js' \
            ! -name 'Code.gs' \
            ! -name 'Código.gs' \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/protected-before.sha256

      - name: Apply dark mode overlay
        shell: bash
        env:
          BUILD_ID: "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          node prepare-dark-mode-deploy.mjs /tmp/boardaudit-production

      - name: Verify only frontend entry files changed
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/boardaudit-production
          find . -maxdepth 1 -type f \
            ! -name 'Index.html' \
            ! -name 'Código.js' \
            ! -name 'Code.js' \
            ! -name 'Code.gs' \
            ! -name 'Código.gs' \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/protected-after.sha256
          diff -u /tmp/protected-before.sha256 /tmp/protected-after.sha256
          grep -q 'MODO NOTURNO FIXO - PRODUCAO' Index.html
          grep -q 'AUDIT_BUILD_ATUAL' Index.html
          grep -Eq 'AUDIT_BUILD_ID_FRONTEND' Código.js Code.js Code.gs Código.gs 2>/dev/null

      - name: Push preserved production plus overlay
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/boardaudit-production/.clasp.json <<'JSON'
          {
            "scriptId": "1-eZr8B0D-PdnQVFh9Qnv2GV23WvQVxa42tlQ-lVknfWbYaz8QpBM4rJ9",
            "rootDir": "."
          }
          JSON
          cd /tmp/boardaudit-production
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" push --force

      - name: Update production deployment
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/boardaudit-production
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" deploy \
            --deploymentId AKfycbz9guo1cK-9T5Hdy_RjHt5yn0JuRjY2b37IlqJ9xPdHC47mL_jbliR5TaTK94Hh3SUQEA \
            --description "Board Audit - dark mode overlay + automatic build refresh"

      - name: Remove local authentication file
        if: always()
        run: rm -f "$HOME/.clasprc.json"
