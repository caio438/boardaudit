name: Run controlled audit E2E direct

on:
  push:
    branches:
      - qa/run-controlled-audit-once

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: apps-script-production

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure clasp authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          cat > .clasp.json <<'JSON'
          {
            "scriptId": "1-eZr8B0D-PdnQVFh9Qnv2GV23WvQVxa42tlQ-lVknfWbYaz8QpBM4rJ9",
            "rootDir": "."
          }
          JSON

      - name: Execute controlled audit against Apps Script HEAD
        shell: bash
        run: |
          set -euo pipefail
          npx clasp run-function EXECUTAR_TESTE_CONTROLADO_AUDITORIA_V5 --params '[]' 2>&1 | tee /tmp/qa-audit-result.txt
          if grep -q '^Exception:' /tmp/qa-audit-result.txt; then
            exit 1
          fi
          grep -q '"sucesso":true\|"sucesso": true' /tmp/qa-audit-result.txt
          grep -q 'AGUARDANDO_VINCULO' /tmp/qa-audit-result.txt
          grep -q 'VALIDADA' /tmp/qa-audit-result.txt
          grep -q 'APROVADA' /tmp/qa-audit-result.txt
          echo "QA_AUDITORIA_E2E_OK=1"

      - name: Save QA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-audit-e2e-${{ github.run_id }}
          path: /tmp/qa-audit-result.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Cleanup auth
        if: always()
        run: rm -f "$HOME/.clasprc.json"
