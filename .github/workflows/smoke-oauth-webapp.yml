name: Smoke OAuth webapp

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, 'Smoke: oauth webapp')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: apps-script-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Configure clasp
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npx clasp deployments >/dev/null
      - name: Extract refreshed access token
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = process.env.HOME + '/.clasprc.json';
          const j = JSON.parse(fs.readFileSync(p,'utf8'));
          const token =
            (j.tokens && j.tokens.default && j.tokens.default.access_token) ||
            (j.token && j.token.access_token) ||
            j.access_token || '';
          if (!token) process.exit(2);
          fs.writeFileSync('/tmp/google_access_token', token, {mode:0o600});
          NODE
      - name: Probe authenticated web app debug
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/google_access_token)"
          URL="https://script.google.com/macros/s/AKfycbz9guo1cK-9T5Hdy_RjHt5yn0JuRjY2b37IlqJ9xPdHC47mL_jbliR5TaTK94Hh3SUQEA/exec?debug=1"
          curl -L -sS -H "Authorization: Bearer $TOKEN" "$URL" -o /tmp/debug.json
          head -c 500 /tmp/debug.json
          echo
          grep -q '"sistema"' /tmp/debug.json
      - if: always()
        run: rm -f "$HOME/.clasprc.json" /tmp/google_access_token
