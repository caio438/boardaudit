name: Read Beaga RD live (owner command, read only)
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  beaga-read:
    if: ${{ github.event.issue.number == 142 && github.event.comment.user.login == 'caio438' && github.event.comment.body == '/volum-beaga-refresh' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: apps-script-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Configure short-lived Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Read fresh Beaga RD/Board via Apps Script API (no CRM updates)
        shell: bash
        run: |
          set -euo pipefail
          npx clasp versions >/tmp/beaga-versions.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cred=JSON.parse(fs.readFileSync(process.env.HOME+'/.clasprc.json','utf8'));
          const token=cred?.tokens?.default?.access_token||cred?.token?.access_token||cred?.access_token||'';
          const conf=JSON.parse(fs.readFileSync('.clasp.json','utf8'));
          const id=String(conf.scriptId||'');
          if(!token||!id)throw new Error('Credencial de execucao ou scriptId indisponivel.');
          fs.writeFileSync('/tmp/beaga-access-token',token,{mode:0o600});
          fs.writeFileSync('/tmp/beaga-script-id',id,{mode:0o600});
          fs.writeFileSync('/tmp/beaga-args.json',JSON.stringify({
            function:'VOLUM_PREVIEW_LEAD_PRIVADO',
            parameters:['6acc888b98976f0023dc583f'],
            devMode:true
          }),{mode:0o600});
          NODE
          TOKEN="$(cat /tmp/beaga-access-token)"
          SCRIPT_ID="$(cat /tmp/beaga-script-id)"
          http="$(curl --silent --show-error --max-time 240 --oauth2-bearer "$TOKEN" \
            --header 'Content-Type: application/json; charset=utf-8' \
            --request POST \
            --data-binary @/tmp/beaga-args.json \
            --output /tmp/beaga-direct-result.json \
            --write-out '%{http_code}' \
            "https://script.googleapis.com/v1/scripts/$SCRIPT_ID:run" || true)"
          echo "LIVE_READ_EXEC_HTTP=$http"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=fs.readFileSync('/tmp/beaga-direct-result.json','utf8');
          let data;try{data=JSON.parse(raw);}catch(e){console.log('LIVE_READ_STATUS=NON_JSON_EXEC_RESPONSE');process.exit(2);}
          const err=data.error||data.response?.error||{};
          if(data.error||data.response?.error){
            const code=String(err.code||'NONE');
            const status=String(err.status||'SCRIPT_EXCEPTION');
            const detail=Array.isArray(err.details)?err.details[0]||{}:{};
            const tag=String(detail.errorMessage||'').replace(/[^\w\s:.-]/g,' ').slice(0,160);
            console.log('LIVE_READ_STATUS=API_EXEC_ERROR');
            console.log('LIVE_READ_ERROR_CODE='+code);
            console.log('LIVE_READ_ERROR_TYPE='+status);
            console.log('LIVE_READ_ERROR_HINT='+tag);
            process.exit(2);
          }
          const r=data.response?.result||null;
          if(!r||r.sucesso!==true||r.modo!=='PREVIEW_SEM_PUBLICACAO'||r.somenteLeitura!==true){
            console.log('LIVE_READ_STATUS=INVALID_OR_MISSING_RESULT');
            console.log('LIVE_READ_TOP_LEVEL_KEYS='+Object.keys(data).join(','));
            process.exit(2);
          }
          const f=r.fontes||{},n=r.quantidades||{},s=r.sinais||{};
          const clean=v=>Number(v)||0;
          console.log('LIVE_READ_STATUS=SUCCESS');
          console.log('LIVE_READ_AT='+new Date().toISOString());
          console.log('LIVE_READ_TASKS='+clean(n.tarefas));
          console.log('LIVE_READ_TASKS_DONE='+clean(n.tarefasConcluidas));
          console.log('LIVE_READ_ACTIVITIES='+clean(n.atividades));
          console.log('LIVE_READ_NOTES='+clean(n.anotacoes));
          console.log('LIVE_READ_BOARD_CALLS='+clean(n.chamadasNoBoard));
          console.log('LIVE_READ_TIMELINE_EVENTS='+clean(n.eventosLinhaTempo));
          console.log('LIVE_READ_STAGE_MOVEMENTS='+clean(n.historicoEtapas));
          console.log('LIVE_READ_ACTIVITIES_COMPLETE='+String(f.atividades?.completo===true));
          console.log('LIVE_READ_ACTIVITY_TYPE_CONFLICTS='+clean(f.atividades?.conflitosDeTipo));
          console.log('LIVE_READ_TASKS_COMPLETE='+String(f.tarefas?.completo===true));
          console.log('LIVE_READ_RESCHEDULE_NOTE_COUNT='+((s.anotacaoCancelamentoOuReagendamento||[]).length));
          console.log('LIVE_READ_NO_ANSWER_NOTE_COUNT='+((s.anotacaoNaoAtendeu||[]).length));
          console.log('LIVE_READ_RECOVERY_3RD_CALL_TASK_COUNT='+((s.tarefaRecoveryDia1Ligacao3||[]).length));
          console.log('LIVE_READ_ACTIVITY_TYPES='+JSON.stringify(r.tiposAtividade||{}));
          NODE
      - name: Remove credentials and raw in-run output
        if: always()
        shell: bash
        run: rm -f "$HOME/.clasprc.json" /tmp/beaga-versions.txt /tmp/beaga-access-token /tmp/beaga-script-id /tmp/beaga-args.json /tmp/beaga-direct-result.json /tmp/beaga-readout.txt
