name: QA Suzana coaching self-repair

on:
  push:
    branches:
      - qa/suzana-generic-coaching-e2e

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure clasp authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          cat > .clasp.json <<'JSON'
          {
            "scriptId": "1-eZr8B0D-PdnQVFh9Qnv2GV23WvQVxa42tlQ-lVknfWbYaz8QpBM4rJ9",
            "rootDir": "."
          }
          JSON

      - name: Locate Suzana interaction and current pitch
        shell: bash
        env:
          TARGET_TRANSCRIPT: "TLDV_6aabd63fa6d95700137fadea"
        run: |
          set -euo pipefail
          npx clasp run-function carregarDadosAuditoriasV3 --params '[]' > /tmp/audit-data-before.txt 2>&1
          node <<'NODE'
          const fs = require('fs');
          const targetId = process.env.TARGET_TRANSCRIPT;
          const raw = fs.readFileSync('/tmp/audit-data-before.txt', 'utf8');
          const first = raw.indexOf('{');
          const last = raw.lastIndexOf('}');
          if (first < 0 || last < first) throw new Error('Não foi possível extrair o JSON de carregarDadosAuditoriasV3.');
          const dados = JSON.parse(raw.slice(first, last + 1));
          if (String(((dados || {}).configuracao || {}).engineVersao || '') !== '6.0.2') {
            throw new Error('Apps Script HEAD não está no engine 6.0.2.');
          }
          const interacoes = Array.isArray(dados.interacoes) ? dados.interacoes : [];
          const alvo = interacoes.find(i => String(i.idTranscricao || '') === targetId);
          if (!alvo) throw new Error('Transcrição Suzana não encontrada: ' + targetId);

          let tipo = String(alvo.funcao || '').toUpperCase();
          const pitchesAtuais = (Array.isArray(dados.pitches) ? dados.pitches : []).filter(p =>
            String(p.idCliente || '') === String(alvo.idCliente || '') &&
            p.pitchAtual === true &&
            String(p.status || 'ATIVO').toUpperCase() === 'ATIVO' &&
            ['SDR', 'CLOSER'].includes(String(p.tipoPitch || '').toUpperCase())
          );
          if (!['SDR', 'CLOSER'].includes(tipo)) {
            const tipos = [...new Set(pitchesAtuais.map(p => String(p.tipoPitch || '').toUpperCase()))];
            if (tipos.length === 1) tipo = tipos[0];
          }
          if (!['SDR', 'CLOSER'].includes(tipo)) {
            throw new Error('Não foi possível determinar SDR/CLOSER de forma segura para a Suzana.');
          }
          const pitch = pitchesAtuais.find(p => String(p.tipoPitch || '').toUpperCase() === tipo);
          if (!pitch) throw new Error('Nenhum pitch atual ' + tipo + ' encontrado para o cliente da Suzana.');

          const anteriores = (Array.isArray(dados.auditorias) ? dados.auditorias : [])
            .filter(a => String(a.idInteracao || '') === String(alvo.idInteracao || ''));
          const anterior = anteriores[0] || null;
          const gateAnterior = (((anterior || {}).resultado || {}).validacao_board || {});

          const params = {
            idCliente: alvo.idCliente,
            idPitch: pitch.idPitch,
            idInteracao: alvo.idInteracao,
            tipoAuditoria: tipo,
            nomeSdr: alvo.vendedor || '',
            evitarDuplicidade: true
          };
          fs.writeFileSync('/tmp/suzana-params.json', JSON.stringify(params));
          fs.writeFileSync('/tmp/suzana-before.json', JSON.stringify({
            targetTranscript: targetId,
            idInteracao: alvo.idInteracao,
            idCliente: alvo.idCliente,
            tipoAuditoria: tipo,
            idPitch: pitch.idPitch,
            auditoriaAnterior: anterior ? {
              idAuditoria: anterior.idAuditoria || '',
              status: anterior.status || '',
              validacaoStatus: anterior.validacaoStatus || '',
              automacaoStatus: anterior.automacaoStatus || '',
              gateStatus: gateAnterior.status || '',
              bloqueios: gateAnterior.bloqueios || []
            } : null
          }, null, 2));
          console.log('SUZANA_TARGET_FOUND=1');
          console.log('SUZANA_TYPE=' + tipo);
          console.log('SUZANA_PREVIOUS_GATE=' + String(gateAnterior.status || 'SEM_AUDITORIA'));
          NODE

      - name: Execute Suzana audit on Apps Script HEAD
        shell: bash
        run: |
          set -euo pipefail
          PARAMS="$(node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/suzana-params.json','utf8')); process.stdout.write(JSON.stringify([p]));")"
          npx clasp run-function executarAuditoriaV3 --params "$PARAMS" > /tmp/suzana-result.txt 2>&1
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/suzana-result.txt', 'utf8');
          const first = raw.indexOf('{');
          const last = raw.lastIndexOf('}');
          if (first < 0 || last < first) throw new Error('A execução da Suzana não retornou JSON.');
          const result = JSON.parse(raw.slice(first, last + 1));
          const audit = result.auditoria || {};
          const gate = ((audit.resultado || {}).validacao_board || {});
          if (result.sucesso !== true) throw new Error('A execução não retornou sucesso=true.');
          if (String(audit.validacaoStatus || '').toUpperCase() !== 'VALIDADA') {
            throw new Error('Auditoria não ficou VALIDADA: ' + String(audit.validacaoStatus || ''));
          }
          if (String(gate.status || '').toUpperCase() === 'BLOQUEADO') {
            throw new Error('Gate continua BLOQUEADO: ' + JSON.stringify(gate.bloqueios || []));
          }
          if (!['EM_REVISAO', 'APROVADA'].includes(String(audit.status || '').toUpperCase())) {
            throw new Error('Status inesperado após auditoria: ' + String(audit.status || ''));
          }
          if (String(audit.automacaoStatus || '').toUpperCase() !== 'AGUARDANDO_REVISAO' &&
              String(audit.status || '').toUpperCase() !== 'APROVADA') {
            throw new Error('Auditoria não parou para revisão humana: ' + String(audit.automacaoStatus || ''));
          }
          fs.writeFileSync('/tmp/suzana-summary.json', JSON.stringify({
            sucesso: true,
            reutilizada: Boolean(result.reutilizada),
            idAuditoria: audit.idAuditoria || '',
            status: audit.status || '',
            validacaoStatus: audit.validacaoStatus || '',
            automacaoStatus: audit.automacaoStatus || '',
            gateStatus: gate.status || '',
            alertas: gate.alertas || [],
            bloqueios: gate.bloqueios || [],
            score: audit.score,
            tipoAuditoria: audit.tipoAuditoria || ''
          }, null, 2));
          console.log('SUZANA_AUDIT_SUCCESS=1');
          console.log('SUZANA_GATE=' + String(gate.status || ''));
          console.log('SUZANA_AUDIT_ID=' + String(audit.idAuditoria || ''));
          NODE

      - name: Verify persisted result
        shell: bash
        run: |
          set -euo pipefail
          npx clasp run-function carregarDadosAuditoriasV3 --params '[]' > /tmp/audit-data-after.txt 2>&1
          node <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('/tmp/suzana-summary.json', 'utf8'));
          const raw = fs.readFileSync('/tmp/audit-data-after.txt', 'utf8');
          const first = raw.indexOf('{');
          const last = raw.lastIndexOf('}');
          const dados = JSON.parse(raw.slice(first, last + 1));
          const persisted = (dados.auditorias || []).find(a => String(a.idAuditoria || '') === String(summary.idAuditoria || ''));
          if (!persisted) throw new Error('Auditoria reprocessada não foi encontrada na leitura persistida.');
          const gate = (((persisted || {}).resultado || {}).validacao_board || {});
          if (String(gate.status || '').toUpperCase() === 'BLOQUEADO') {
            throw new Error('Resultado persistido voltou BLOQUEADO.');
          }
          console.log('SUZANA_PERSISTED=1');
          console.log('SUZANA_PERSISTED_GATE=' + String(gate.status || ''));
          NODE

      - name: Save targeted QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suzana-generic-coaching-e2e-${{ github.run_id }}
          path: |
            /tmp/suzana-before.json
            /tmp/suzana-summary.json
            /tmp/suzana-result.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Cleanup auth
        if: always()
        run: rm -f "$HOME/.clasprc.json"
