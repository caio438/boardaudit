name: Smoke controlled audit

on:
  workflow_run:
    workflows:
      - Deploy Apps Script automatically
    types:
      - completed

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          startsWith(github.event.workflow_run.head_commit.message, 'Smoke audit:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: apps-script-production
    steps:
      - name: Checkout exact deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure clasp authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Show authorized clasp user
        shell: bash
        run: |
          set -euo pipefail
          npx clasp show-authorized-user --json | tee /tmp/clasp-user.json

      - name: Diagnose remote execution context
        shell: bash
        run: |
          set -euo pipefail
          npx clasp run-function TESTE_SMOKE_DIAGNOSTICO_CONTEXTO --params '[]' 2>&1 | tee /tmp/smoke-context.txt
          if grep -q '^Exception:' /tmp/smoke-context.txt; then
            cat /tmp/smoke-context.txt
            exit 1
          fi

      - name: Run synthetic end-to-end audit
        shell: bash
        run: |
          set -euo pipefail
          npx clasp run-function TESTE_SMOKE_AUDITORIA_AUTOMATICA --params '[]' 2>&1 | tee /tmp/smoke-audit-result.txt
          if grep -q '^Exception:' /tmp/smoke-audit-result.txt; then
            cat /tmp/smoke-audit-result.txt
            exit 1
          fi

      - name: Publish smoke result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-audit-result-${{ github.run_id }}
          path: |
            /tmp/smoke-context.txt
            /tmp/smoke-audit-result.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Cleanup auth
        if: always()
        run: rm -f "$HOME/.clasprc.json"
