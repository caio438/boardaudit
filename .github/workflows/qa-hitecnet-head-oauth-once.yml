name: QA Hitecnet HEAD OAuth once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa:
    if: "${{ startsWith(github.event.head_commit.message, 'QA Hitecnet HEAD:') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apps-script-production

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure clasp authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Pull current Apps Script HEAD for preservation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/boardaudit-qa-remote /tmp/boardaudit-qa-head
          mkdir -p /tmp/boardaudit-qa-remote /tmp/boardaudit-qa-head
          cat > /tmp/boardaudit-qa-remote/.clasp.json <<'JSON'
          {
            "scriptId": "1-eZr8B0D-PdnQVFh9Qnv2GV23WvQVxa42tlQ-lVknfWbYaz8QpBM4rJ9",
            "rootDir": "."
          }
          JSON
          cd /tmp/boardaudit-qa-remote
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" pull
          rm -f .clasp.json

      - name: Build safe QA HEAD source
        shell: bash
        env:
          BUILD_ID: "qa-head-${{ github.sha }}"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cp -- *.gs /tmp/boardaudit-qa-head/
          cp Index.html appsscript.json /tmp/boardaudit-qa-head/

          for src in /tmp/boardaudit-qa-remote/*.js; do
            [ -e "$src" ] || continue
            base="$(basename "$src" .js)"
            if [ "$base" = "Código" ]; then
              local_name="Code.gs"
            else
              local_name="$base.gs"
            fi
            if [ ! -f "/tmp/boardaudit-qa-head/$local_name" ]; then
              cp "$src" "/tmp/boardaudit-qa-head/$local_name"
            fi
          done

          for src in /tmp/boardaudit-qa-remote/*.html; do
            [ -e "$src" ] || continue
            name="$(basename "$src")"
            if [ ! -f "/tmp/boardaudit-qa-head/$name" ]; then
              cp "$src" "/tmp/boardaudit-qa-head/$name"
            fi
          done

          node prepare-dark-mode-deploy.mjs /tmp/boardaudit-qa-head
          for file in /tmp/boardaudit-qa-head/*.gs; do
            node -e "new Function(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done
          grep -q "function audV3RepararEvidenciasRastreaveis_" /tmp/boardaudit-qa-head/AuditoriaV3.gs

      - name: Push validated source to Apps Script HEAD only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/boardaudit-qa-head/.clasp.json <<'JSON'
          {
            "scriptId": "1-eZr8B0D-PdnQVFh9Qnv2GV23WvQVxa42tlQ-lVknfWbYaz8QpBM4rJ9",
            "rootDir": "."
          }
          JSON
          cd /tmp/boardaudit-qa-head
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" push --force

      - name: Verify Apps Script HEAD contains evidence anchoring
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/boardaudit-qa-after
          mkdir -p /tmp/boardaudit-qa-after
          cat > /tmp/boardaudit-qa-after/.clasp.json <<'JSON'
          {
            "scriptId": "1-eZr8B0D-PdnQVFh9Qnv2GV23WvQVxa42tlQ-lVknfWbYaz8QpBM4rJ9",
            "rootDir": "."
          }
          JSON
          cd /tmp/boardaudit-qa-after
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" pull
          grep -q "function audV3RepararEvidenciasRastreaveis_" AuditoriaV3.js
          echo "QA_HEAD_EVIDENCE_ANCHOR=1"

      - name: Refresh Google OAuth token
        shell: bash
        run: |
          set -euo pipefail
          npx clasp versions > /tmp/clasp-versions.txt

      - name: Extract Google access token
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync(process.env.HOME + '/.clasprc.json', 'utf8'));
          const token =
            (j.tokens && j.tokens.default && j.tokens.default.access_token) ||
            (j.token && j.token.access_token) ||
            j.access_token || '';
          if (!token) process.exit(2);
          fs.writeFileSync('/tmp/google_access_token', token, {mode: 0o600});
          NODE

      - name: Execute Hitecnet audit on HEAD
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/google_access_token)"
          URL="https://script.google.com/macros/s/AKfycbxk_jvoxhRCiHKjTSN6wKWH3cbh07ziB6xOYBI5rWuE/dev?qa_hitecnet_stec=1"
          code="$(curl -L -sS -H "Authorization: Bearer $TOKEN" -o /tmp/hitecnet-head.txt -w '%{http_code}' "$URL" || true)"
          echo "HEAD_HTTP_STATUS=$code"
          if [ "$code" != "200" ]; then
            echo "HITECNET_HEAD_AUDIT=HTTP_FAILURE"
            exit 1
          fi
          if ! grep -q '"sucesso"[[:space:]]*:[[:space:]]*true' /tmp/hitecnet-head.txt; then
            echo "HITECNET_HEAD_AUDIT=NO_SUCCESS_MARKER"
            exit 1
          fi
          echo "HITECNET_HEAD_AUDIT=SUCCESS"

      - name: Cleanup
        if: always()
        run: |
          rm -f "$HOME/.clasprc.json" /tmp/google_access_token /tmp/hitecnet-head.txt /tmp/clasp-versions.txt
          rm -rf /tmp/boardaudit-qa-remote /tmp/boardaudit-qa-head /tmp/boardaudit-qa-after
