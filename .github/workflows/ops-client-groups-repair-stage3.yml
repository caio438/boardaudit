name: Ops repair client groups stage 3 after deploy

on:
  workflow_run:
    workflows:
      - Deploy Apps Script automatically
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  repair-client-groups-stage3:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: apps-script-production

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve operational request
        id: target
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          prefix="Ops repair client groups stage3:"
          if [[ "$subject" == "$prefix"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "OPS_CLIENT_GROUPS_REPAIR_STAGE3_REQUESTED=1"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "OPS_CLIENT_GROUPS_REPAIR_STAGE3_SKIPPED=commit_not_operational"
          fi

      - name: Setup Node.js
        if: steps.target.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.target.outputs.run == 'true'
        run: npm ci

      - name: Configure clasp authentication
        if: steps.target.outputs.run == 'true'
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Refresh Google OAuth token
        if: steps.target.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx clasp versions > /tmp/clasp-versions-client-groups-repair-stage3.txt

      - name: Extract Google access token
        if: steps.target.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync(process.env.HOME + '/.clasprc.json', 'utf8'));
          const token =
            (j.tokens && j.tokens.default && j.tokens.default.access_token) ||
            (j.token && j.token.access_token) ||
            j.access_token || '';
          if (!token) process.exit(2);
          fs.writeFileSync('/tmp/google_access_token_client_groups_repair_stage3', token, {mode: 0o600});
          NODE

      - name: Remove cross-group meeting links with backup
        if: steps.target.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/google_access_token_client_groups_repair_stage3)"
          CONFIRM="CONFIRMAR_REPARO_GRUPOS_CLIENTES_ETAPA3"
          BASE="https://script.google.com/macros/s/AKfycbz9guo1cK-9T5Hdy_RjHt5yn0JuRjY2b37IlqJ9xPdHC47mL_jbliR5TaTK94Hh3SUQEA/exec"
          URL="$BASE?ops_repair_client_groups_stage3=1&confirm=$CONFIRM"

          code="$(curl -sS --max-time 360 --location-trusted             --oauth2-bearer "$TOKEN"             -o /tmp/client-groups-repair-stage3-result.txt             -w '%{http_code}'             "$URL" || true)"
          echo "CLIENT_GROUPS_REPAIR_STAGE3_HTTP_STATUS=$code"
          test "$code" = "200"

          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/client-groups-repair-stage3-result.txt','utf8').trim();
          if (!raw) throw new Error('Resposta vazia.');
          if (/<!doctype html|<html/i.test(raw.slice(0,500))) throw new Error('Resposta HTML no reparo etapa 3.');
          const first=raw.indexOf('{'), last=raw.lastIndexOf('}');
          if (first<0 || last<first) throw new Error('Resposta sem JSON.');
          const result=JSON.parse(raw.slice(first,last+1));
          if (result.sucesso !== true || Number(result.etapa) !== 3 || result.concluida !== true) {
            throw new Error('Reparo etapa 3 não concluiu.');
          }
          const depois=result.depois || {};
          if (Number(depois.reunioes||0) || Number(depois.interacoes||0) || Number(depois.formalizacoes||0) || Number(depois.vinculosCruzados||0)) {
            throw new Error('Ainda existem conflitos após etapa 3.');
          }
          console.log('CLIENT_GROUPS_REPAIR_STAGE3_OK=1');
          console.log('BACKUP=' + (result.backup && result.backup.nome || ''));
          console.log('VINCULOS_REMOVIDOS=' + Number(result.aplicados && result.aplicados.vinculosCruzados || 0));
          fs.writeFileSync('/tmp/client-groups-repair-stage3-summary.json', JSON.stringify(result,null,2));
          NODE

      - name: Save repair evidence
        if: always() && steps.target.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: client-groups-repair-stage3-${{ github.run_id }}
          path: |
            /tmp/client-groups-repair-stage3-summary.json
            /tmp/client-groups-repair-stage3-result.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup authentication
        if: always() && steps.target.outputs.run == 'true'
        run: rm -f "$HOME/.clasprc.json" /tmp/google_access_token_client_groups_repair_stage3 /tmp/clasp-versions-client-groups-repair-stage3.txt
