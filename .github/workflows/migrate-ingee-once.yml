name: Migrate INGEE group once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  migrate:
    if: "${{ github.event.head_commit.message == 'Migration: execute INGEE unification' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: apps-script-production

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure clasp authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          cat > .clasp.json <<'JSON'
          {
            "scriptId": "1-eZr8B0D-PdnQVFh9Qnv2GV23WvQVxa42tlQ-lVknfWbYaz8QpBM4rJ9",
            "rootDir": "."
          }
          JSON

      - name: Execute INGEE unification
        shell: bash
        run: |
          set -euo pipefail
          npx clasp run-function executarUnificacaoIngeeSinergiaSemeioCbi --params '["CONFIRMAR_UNIFICACAO_INGEE"]' 2>&1 | tee /tmp/ingee-migration-result.txt
          if grep -q '^Exception:' /tmp/ingee-migration-result.txt; then
            exit 1
          fi
          grep -q '"sucesso":true\|"sucesso": true' /tmp/ingee-migration-result.txt
          echo "INGEE_MIGRATION_OK=1"

      - name: Save migration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingee-migration-result-${{ github.run_id }}
          path: /tmp/ingee-migration-result.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup auth
        if: always()
        run: rm -f "$HOME/.clasprc.json"
