name: Validate Apps Script

on:
  pull_request:
  push:
    branches:
      - main
      - chore/apps-script-safe-deploy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm test

      - name: Preview files sent to Apps Script
        run: npx clasp show-file-status
