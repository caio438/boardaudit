name: Validate Apps Script

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA expected by the release workflow
        required: false
        type: string

  pull_request:

  push:
    branches:
      - main
      - chore/apps-script-safe-deploy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify dispatched revision
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm test

      - name: Preview files sent to Apps Script
        run: npx clasp show-file-status
