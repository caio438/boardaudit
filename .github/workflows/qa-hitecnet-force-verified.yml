name: QA Hitecnet force verified

on:
  push:
    branches:
      - main
      - fix/apps-script-verified-execution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'QA Hitecnet verify:') || startsWith(github.event.head_commit.message, 'Fix: verifica execucao remota') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apps-script-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure OAuth credential
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Execute Hitecnet audit through Apps Script API
        shell: bash
        env:
          APPS_SCRIPT_ID: 1-eZr8B0D-PdnQVFh9Qnv2GV23WvQVxa42tlQ-lVknfWbYaz8QpBM4rJ9
        run: |
          set -euo pipefail
          node scripts/run-apps-script-function.mjs \
            --function QA_HITECNET_STEC_FORCAR_AUDITORIA \
            --params '[]' \
            --expect-true sucesso
          echo "HITECNET_VERIFY=SUCCESS"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.clasprc.json"
