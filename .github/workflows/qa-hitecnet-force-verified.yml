name: Verify Apps Script Execution API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apps-script-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure OAuth credential
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Execute read-only probe through Apps Script API
        shell: bash
        env:
          APPS_SCRIPT_ID: 1-eZr8B0D-PdnQVFh9Qnv2GV23WvQVxa42tlQ-lVknfWbYaz8QpBM4rJ9
        run: |
          set -euo pipefail
          node scripts/run-apps-script-function.mjs \
            --function QA_EXECUTION_API_READ_ONLY_PROBE \
            --params '[]' \
            --expect-true sucesso
          echo "EXECUTION_API_PROBE=SUCCESS"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.clasprc.json"
