name: Deploy Apps Script automatically

on:
  workflow_run:
    workflows:
      - Validate Apps Script
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apps-script-production

    steps:
      - name: Checkout exact validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Revalidate exact revision
        run: npm test

      - name: Configure clasp authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Check Apps Script version capacity
        shell: bash
        run: |
          set -euo pipefail
          versions_output="$(npx clasp versions)"
          printf '%s\n' "$versions_output" | tee /tmp/boardaudit-versions.txt
          version_count="$(printf '%s\n' "$versions_output" | sed -n 's/^Found \([0-9][0-9]*\) versions\.$/\1/p' | head -1)"
          test -n "$version_count"
          echo "APPS_SCRIPT_VERSION_COUNT=$version_count"
          if [ "$version_count" -ge 200 ]; then
            echo "::error::Apps Script atingiu o limite de 200 versões. Exclua versões antigas não usadas em Project History antes de publicar novamente."
            exit 1
          fi

      - name: Pull current production for preservation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/boardaudit-production /tmp/boardaudit-deploy
          mkdir -p /tmp/boardaudit-production /tmp/boardaudit-deploy
          cat > /tmp/boardaudit-production/.clasp.json <<'JSON'
          {
            "scriptId": "1-eZr8B0D-PdnQVFh9Qnv2GV23WvQVxa42tlQ-lVknfWbYaz8QpBM4rJ9",
            "rootDir": "."
          }
          JSON
          cd /tmp/boardaudit-production
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" pull
          rm -f .clasp.json

      - name: Save rollback snapshot
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-production-before-auto-deploy-${{ github.run_id }}
          path: /tmp/boardaudit-production
          if-no-files-found: error
          retention-days: 7

      - name: Build deployment source preserving remote-only files
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          cp -- *.gs /tmp/boardaudit-deploy/
          cp Index.html appsscript.json /tmp/boardaudit-deploy/

          for src in /tmp/boardaudit-production/*.js; do
            [ -e "$src" ] || continue
            base="$(basename "$src" .js)"
            if [ "$base" = "Código" ]; then
              local_name="Code.gs"
            else
              local_name="$base.gs"
            fi
            if [ ! -f "/tmp/boardaudit-deploy/$local_name" ]; then
              cp "$src" "/tmp/boardaudit-deploy/$local_name"
              echo "Preservado arquivo remoto sem equivalente no GitHub: $local_name"
            fi
          done

          for src in /tmp/boardaudit-production/*.html; do
            [ -e "$src" ] || continue
            name="$(basename "$src")"
            if [ ! -f "/tmp/boardaudit-deploy/$name" ]; then
              cp "$src" "/tmp/boardaudit-deploy/$name"
              echo "Preservado HTML remoto sem equivalente no GitHub: $name"
            fi
          done

      - name: Stamp build and validate deploy source
        shell: bash
        env:
          BUILD_ID: "${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          set -euo pipefail
          node prepare-dark-mode-deploy.mjs /tmp/boardaudit-deploy

          for file in /tmp/boardaudit-deploy/*.gs; do
            node -e "new Function(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done

          node -e "const fs=require('fs'); const h=fs.readFileSync('/tmp/boardaudit-deploy/Index.html','utf8'); for(const m of h.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)) new Function(m[1]);"

      - name: Push exact validated source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/boardaudit-deploy/.clasp.json <<'JSON'
          {
            "scriptId": "1-eZr8B0D-PdnQVFh9Qnv2GV23WvQVxa42tlQ-lVknfWbYaz8QpBM4rJ9",
            "rootDir": "."
          }
          JSON
          cd /tmp/boardaudit-deploy
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" push --force

      - name: Update production deployment
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/boardaudit-deploy
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" deploy \
            --deploymentId AKfycbz9guo1cK-9T5Hdy_RjHt5yn0JuRjY2b37IlqJ9xPdHC47mL_jbliR5TaTK94Hh3SUQEA \
            --description "Board Audit auto deploy ${{ github.event.workflow_run.head_sha }}"

      - name: Verify live Apps Script after deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/boardaudit-live-after
          mkdir -p /tmp/boardaudit-live-after
          cat > /tmp/boardaudit-live-after/.clasp.json <<'JSON'
          {
            "scriptId": "1-eZr8B0D-PdnQVFh9Qnv2GV23WvQVxa42tlQ-lVknfWbYaz8QpBM4rJ9",
            "rootDir": "."
          }
          JSON
          cd /tmp/boardaudit-live-after
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" pull
          rm -f .clasp.json

          compare_pair() {
            local expected="$1"
            local live="$2"
            test -f "$expected"
            test -f "$live"
            cmp -s "$expected" "$live" || {
              echo "Post-deploy mismatch: $expected <-> $live"
              diff -u "$live" "$expected" | head -160 || true
              exit 1
            }
          }

          compare_pair "/tmp/boardaudit-deploy/AuditoriaV3.gs" "/tmp/boardaudit-live-after/AuditoriaV3.js"
          compare_pair "/tmp/boardaudit-deploy/RdAuditorias.gs" "/tmp/boardaudit-live-after/RdAuditorias.js"
          compare_pair "/tmp/boardaudit-deploy/PublicacaoCircle.gs" "/tmp/boardaudit-live-after/PublicacaoCircle.js"
          compare_pair "/tmp/boardaudit-deploy/AutomacaoCentral.gs" "/tmp/boardaudit-live-after/AutomacaoCentral.js"

          LIVE_CODE="/tmp/boardaudit-live-after/Code.js"
          if [ ! -f "$LIVE_CODE" ] && [ -f "/tmp/boardaudit-live-after/Código.js" ]; then
            LIVE_CODE="/tmp/boardaudit-live-after/Código.js"
          fi
          compare_pair "/tmp/boardaudit-deploy/Code.gs" "$LIVE_CODE"

          compare_pair "/tmp/boardaudit-deploy/Index.html" "/tmp/boardaudit-live-after/Index.html"
          compare_pair "/tmp/boardaudit-deploy/appsscript.json" "/tmp/boardaudit-live-after/appsscript.json"

          grep -q "MODO NOTURNO FIXO - PRODUCAO" /tmp/boardaudit-live-after/Index.html
          grep -q "AUDIT_BUILD_ATUAL" /tmp/boardaudit-live-after/Index.html
          grep -q "function audV3FinalizarAutomaticamente_" /tmp/boardaudit-live-after/AuditoriaV3.js
          grep -q "function audRdPublicarAutomaticamente_" /tmp/boardaudit-live-after/RdAuditorias.js
          grep -q "AGUARDANDO_VINCULO" /tmp/boardaudit-live-after/RdAuditorias.js

          cat > /tmp/boardaudit-live-after/.clasp.json <<'JSON'
          {
            "scriptId": "1-eZr8B0D-PdnQVFh9Qnv2GV23WvQVxa42tlQ-lVknfWbYaz8QpBM4rJ9",
            "rootDir": "."
          }
          JSON
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" deployments | tee /tmp/boardaudit-deployments.txt
          grep -q "AKfycbz9guo1cK-9T5Hdy_RjHt5yn0JuRjY2b37IlqJ9xPdHC47mL_jbliR5TaTK94Hh3SUQEA" /tmp/boardaudit-deployments.txt

          echo "POST_DEPLOY_SOURCE_MATCH=1"
          echo "POST_DEPLOY_AUTOMATION_MARKERS=1"
          echo "POST_DEPLOY_DEPLOYMENT_ID=1"

      - name: Probe web app response
        shell: bash
        run: |
          set -euo pipefail
          URL="https://script.google.com/macros/s/AKfycbz9guo1cK-9T5Hdy_RjHt5yn0JuRjY2b37IlqJ9xPdHC47mL_jbliR5TaTK94Hh3SUQEA/exec"
          code="$(curl -L -sS -o /tmp/boardaudit-webapp.html -w '%{http_code}' "$URL" || true)"
          echo "WEBAPP_HTTP_STATUS=$code"
          test "$code" = "200"
          if grep -q "audit-build" /tmp/boardaudit-webapp.html 2>/dev/null; then
            echo "WEBAPP_RENDERED_CURRENT_HTML=1"
          else
            echo "WEBAPP_RENDERED_CURRENT_HTML=0"
            echo "Web app may require an authenticated Google session; source/deployment verification already passed."
          fi

      - name: Remove local authentication file
        if: always()
        run: rm -f "$HOME/.clasprc.json"
