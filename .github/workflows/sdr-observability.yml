name: SDR automation observability

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

jobs:
  status:
    if: >-
      ${{ github.event.issue.number == 142 &&
          github.event.comment.user.login == 'caio438' &&
          github.event.comment.body == '/sdr-status' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: apps-script-production

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure clasp authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npx clasp versions > /tmp/clasp-versions.txt
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync(process.env.HOME + '/.clasprc.json', 'utf8'));
          const token =
            (j.tokens && j.tokens.default && j.tokens.default.access_token) ||
            (j.token && j.token.access_token) ||
            j.access_token || '';
          if (!token) throw new Error('Access token do clasp ausente.');
          fs.writeFileSync('/tmp/google_access_token', token, {mode: 0o600});
          NODE

      - name: Collect production SDR status
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/google_access_token)"
          URL="https://script.google.com/macros/s/AKfycbz9guo1cK-9T5Hdy_RjHt5yn0JuRjY2b37IlqJ9xPdHC47mL_jbliR5TaTK94Hh3SUQEA/exec?ops_sdr_status=1"
          code="$(curl -sS --max-time 180 --location-trusted --oauth2-bearer "$TOKEN" -o /tmp/sdr-status-result.txt -w '%{http_code}' "$URL" || true)"
          echo "SDR_STATUS_HTTP_STATUS=$code"
          test "$code" = "200"
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/sdr-status-result.txt', 'utf8').trim();
          if (!raw || /<!doctype html|<html/i.test(raw.slice(0,500))) throw new Error('Resposta invalida do endpoint SDR.');
          const first = raw.indexOf('{'), last = raw.lastIndexOf('}');
          if (first < 0 || last < first) throw new Error('JSON de status SDR ausente.');
          const r = JSON.parse(raw.slice(first,last+1));
          if (r.sucesso !== true) throw new Error('Endpoint SDR nao retornou sucesso=true.');
          fs.writeFileSync('/tmp/sdr-status.json', JSON.stringify(r,null,2));
          const x=r.resumo||{}, st=r.status||{};
          const lines=[
            '## Status automacao SDR',
            '',
            '- Gerado em: '+String(r.geradoEm||''),
            '- Automacao ativa: '+String(st.ativa),
            '- Gatilhos instalados: '+String(x.gatilhosInstalados||0),
            '- Elegiveis no backlog: '+String(x.elegiveis||0),
            '- Aguardando transcricao: '+String(x.aguardandoTranscricao||0),
            '- Transcritas aguardando auditoria: '+String(x.transcritasAguardandoAuditoria||0),
            '- Processadas hoje: '+String(x.processadasHoje||0),
            '- Saldo hoje: '+String(x.saldoHoje||0),
            '- Fila de ingestao RD: '+String(x.filaIngestaoStatus||'sem estado')+' | '+String(x.filaIngestaoInicio||'?')+' a '+String(x.filaIngestaoFim||'?'),
            '- Linhas persistidas na fila: '+String(x.filaIngestaoLinhasGravadas||0)+' | clientes pendentes: '+String(x.filaIngestaoPendentes||0),
            '- Erros no backlog: '+String(x.errosNoBacklog||0),
            '- Clientes sem pitch SDR atual: '+String(x.clientesSemPitchAtual||0),
            '- Ultima execucao: '+String(st.ultimaExecucao||''),
            '',
            '### Backlog por cliente',
            ...((r.porCliente||[]).slice(0,25).map(v=>'- '+v.cliente+': '+v.elegiveis+' elegiveis | '+v.transcritas+' transcritas | '+v.aguardandoTranscricao+' aguardando transcricao | '+v.comErro+' erro(s)')),
            '',
            '### Erros',
            ...((r.erros||[]).slice(0,20).map(v=>'- '+v.cliente+' | '+v.idInteracao+' | tentativas '+v.tentativasErro+' | '+(v.erro||v.statusAuditoria||'sem detalhe'))),
            '',
            '### Clientes sem pitch',
            ...((r.clientesSemPitchAtual||[]).slice(0,25).map(v=>'- '+(v.nomeCliente||v.idCliente)))
          ];
          fs.writeFileSync('/tmp/sdr-status.md', lines.join('\n'));
          console.log(lines.join('\n'));
          NODE

      - name: Comment status on Ops Control
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 142 --repo "$GITHUB_REPOSITORY" --body-file /tmp/sdr-status.md

      - name: Save observability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdr-observability-${{ github.run_id }}
          path: |
            /tmp/sdr-status.json
            /tmp/sdr-status.md
            /tmp/sdr-status-result.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup authentication
        if: always()
        run: rm -f "$HOME/.clasprc.json" /tmp/google_access_token /tmp/clasp-versions.txt


  manual-mode:
    if: >-
      ${{ github.event.issue.number == 142 &&
          github.event.comment.user.login == 'caio438' &&
          github.event.comment.body == '/board-manual-mode' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: apps-script-production

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure clasp authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npx clasp versions > /tmp/clasp-versions.txt
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync(process.env.HOME + '/.clasprc.json', 'utf8'));
          const token =
            (j.tokens && j.tokens.default && j.tokens.default.access_token) ||
            (j.token && j.token.access_token) ||
            j.access_token || '';
          if (!token) throw new Error('Access token do clasp ausente.');
          fs.writeFileSync('/tmp/google_access_token', token, {mode: 0o600});
          NODE

      - name: Disable all Board automations
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/google_access_token)"
          URL="https://script.google.com/macros/s/AKfycbz9guo1cK-9T5Hdy_RjHt5yn0JuRjY2b37IlqJ9xPdHC47mL_jbliR5TaTK94Hh3SUQEA/exec?ops_disable_all_automation=1"
          code="$(curl -sS --max-time 180 --location-trusted --oauth2-bearer "$TOKEN" -o /tmp/manual-mode-result.txt -w '%{http_code}' "$URL" || true)"
          echo "BOARD_MANUAL_MODE_HTTP_STATUS=$code"
          test "$code" = "200"
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/manual-mode-result.txt', 'utf8').trim();
          if (!raw || /<!doctype html|<html/i.test(raw.slice(0,500))) throw new Error('Resposta invalida do endpoint de modo manual.');
          const first = raw.indexOf('{'), last = raw.lastIndexOf('}');
          if (first < 0 || last < first) throw new Error('JSON de modo manual ausente.');
          const r = JSON.parse(raw.slice(first,last+1));
          if (r.sucesso !== true || String(r.modo || '').toUpperCase() !== 'MANUAL') {
            throw new Error('Board nao confirmou BOARD_MODE=MANUAL.');
          }
          const lines = [
            '## Board em modo manual',
            '',
            '- BOARD_MODE: **MANUAL**',
            '- Triggers removidos: ' + String(r.removidos || 0),
            '- Handlers removidos: ' + ((r.handlersRemovidos || []).join(', ') || 'nenhum'),
            '',
            'Nenhuma auditoria foi executada ou publicada no RD.'
          ];
          fs.writeFileSync('/tmp/manual-mode.md', lines.join('\n'));
          console.log(lines.join('\n'));
          NODE

      - name: Comment manual mode result
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 142 --repo "$GITHUB_REPOSITORY" --body-file /tmp/manual-mode.md

      - name: Cleanup authentication
        if: always()
        run: rm -f "$HOME/.clasprc.json" /tmp/google_access_token /tmp/clasp-versions.txt /tmp/manual-mode-result.txt

  enable-isolated:
    if: >-
      ${{ github.event.issue.number == 142 &&
          github.event.comment.user.login == 'caio438' &&
          github.event.comment.body == '/sdr-enable-isolated' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: apps-script-production

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure clasp authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npx clasp versions > /tmp/clasp-versions.txt
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync(process.env.HOME + '/.clasprc.json', 'utf8'));
          const token =
            (j.tokens && j.tokens.default && j.tokens.default.access_token) ||
            (j.token && j.token.access_token) ||
            j.access_token || '';
          if (!token) throw new Error('Access token do clasp ausente.');
          fs.writeFileSync('/tmp/google_access_token', token, {mode: 0o600});
          NODE

      - name: Enable only SDR pipeline
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/google_access_token)"
          BASE="https://script.google.com/macros/s/AKfycbz9guo1cK-9T5Hdy_RjHt5yn0JuRjY2b37IlqJ9xPdHC47mL_jbliR5TaTK94Hh3SUQEA/exec"
          code="$(curl -sS --max-time 180 --location-trusted --oauth2-bearer "$TOKEN" -o /tmp/sdr-enable-result.txt -w '%{http_code}' "$BASE?ops_sdr_enable_isolated=1" || true)"
          echo "SDR_ENABLE_HTTP_STATUS=$code"
          test "$code" = "200"
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/sdr-enable-result.txt','utf8').trim();
          const first = raw.indexOf('{'), last = raw.lastIndexOf('}');
          if (first < 0 || last < first) throw new Error('Resposta de ativacao SDR sem JSON.');
          const r = JSON.parse(raw.slice(first,last+1));
          const handlers = r.acionadores || {};
          const outside = Array.isArray(handlers.foraDoPipelineSdr) ? handlers.foraDoPipelineSdr : ['status ausente'];
          const ok = r.sucesso === true &&
            r.pipelineSdrIsolado === true &&
            r.modoBoard === 'MANUAL' &&
            r.ingestaoRdApi4comAtiva === true &&
            r.pipelineRdApi4comAtivo === true &&
            r.auditoriaLigacoesAtiva === true &&
            r.publicacaoAutomatica === true &&
            r.aprovacaoAutomatica === true &&
            Number(handlers.ingestao || 0) >= 1 &&
            Number(handlers.watchdog || 0) >= 1 &&
            String(r.cutoffIso || '') !== '' &&
            outside.length === 0;
          const s = (r.statusSdr || {}).resumo || {};
          const lines = [
            '## Pipeline SDR isolado',
            '',
            '- Ativacao confirmada: '+String(ok),
            '- BOARD_MODE: '+String(r.modoBoard || ''),
            '- Ingestao RD/API4COM: '+String(r.ingestaoRdApi4comAtiva),
            '- Pipeline de transcricao/auditoria: '+String(r.pipelineRdApi4comAtivo),
            '- Auditoria de ligacoes: '+String(r.auditoriaLigacoesAtiva),
            '- Trigger diario de ingestao: '+String(handlers.ingestao || 0),
            '- Lote inicial agendado: '+String(r.backlogAgendado),
            '- Watchdogs SDR instalados: '+String(handlers.watchdog || 0),
            '- Cutoff automatico: '+String(r.cutoffIso || ''),
            '- Outros triggers ativos: '+(outside.join(', ') || 'nenhum'),
            '- Publicacao automatica no RD: '+String(r.publicacaoAutomatica),
            '- Aprovacao automatica: '+String(r.aprovacaoAutomatica),
            '- Elegiveis apos cutoff: '+String(s.elegiveis || 0),
            '- Processaveis agora: '+String(s.processaveis || 0),
            '- Transcritas aguardando auditoria: '+String(s.transcritasAguardandoAuditoria || 0),
            '',
            ok ? '**Resultado: somente o pipeline SDR foi reativado.**'
               : '**Resultado: ativacao nao passou em todas as travas.**'
          ];
          fs.writeFileSync('/tmp/sdr-enable-report.md', lines.join('\n'));
          fs.writeFileSync('/tmp/sdr-enable-summary.json', JSON.stringify(r,null,2));
          console.log(lines.join('\n'));
          if (!ok) process.exit(1);
          NODE

      - name: Comment isolated SDR activation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/sdr-enable-report.md ]; then
            gh issue comment 142 --repo "$GITHUB_REPOSITORY" --body-file /tmp/sdr-enable-report.md
          else
            gh issue comment 142 --repo "$GITHUB_REPOSITORY" --body "## Pipeline SDR isolado\n\nFalha antes da validacao final."
          fi

      - name: Save activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdr-enable-isolated-${{ github.run_id }}
          path: |
            /tmp/sdr-enable-result.txt
            /tmp/sdr-enable-summary.json
            /tmp/sdr-enable-report.md
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup authentication
        if: always()
        run: rm -f "$HOME/.clasprc.json" /tmp/google_access_token /tmp/clasp-versions.txt


  tecnosoft-preview:
    if: >-
      ${{ github.event.issue.number == 142 &&
          github.event.comment.user.login == 'caio438' &&
          github.event.comment.body == '/sdr-test-tecnosoft' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apps-script-production

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure clasp authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npx clasp versions > /tmp/clasp-versions.txt
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync(process.env.HOME + '/.clasprc.json', 'utf8'));
          const token =
            (j.tokens && j.tokens.default && j.tokens.default.access_token) ||
            (j.token && j.token.access_token) ||
            j.access_token || '';
          if (!token) throw new Error('Access token do clasp ausente.');
          fs.writeFileSync('/tmp/google_access_token', token, {mode: 0o600});
          NODE

      - name: Select latest transcribed Tecnosoft call
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/google_access_token)"
          BASE="https://script.google.com/macros/s/AKfycbz9guo1cK-9T5Hdy_RjHt5yn0JuRjY2b37IlqJ9xPdHC47mL_jbliR5TaTK94Hh3SUQEA/exec"
          code="$(curl -sS --max-time 180 --location-trusted --oauth2-bearer "$TOKEN" -o /tmp/tecnosoft-status.txt -w '%{http_code}' "$BASE?ops_sdr_status=1" || true)"
          echo "SDR_STATUS_HTTP_STATUS=$code"
          test "$code" = "200"
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/tecnosoft-status.txt','utf8').trim();
          const first = raw.indexOf('{'), last = raw.lastIndexOf('}');
          if (first < 0 || last < first) throw new Error('Status SDR sem JSON.');
          const r = JSON.parse(raw.slice(first,last+1));
          const all = (r.backlog || []).filter(x => x.cliente === 'Tecnosoft' && x.transcrita === true);
          if (!all.length) throw new Error('Nenhuma ligacao transcrita da Tecnosoft encontrada no backlog.');
          const byDate = arr => arr.slice().sort((a,b) => Date.parse(b.dataInteracao || 0) - Date.parse(a.dataInteracao || 0));
          const failed = byDate(all.filter(x => String(x.statusAuditoria || '').toUpperCase() === 'ERRO_AUTOMACAO'));
          const chosen = failed[0] || byDate(all)[0];
          fs.writeFileSync('/tmp/tecnosoft-target.json', JSON.stringify(chosen,null,2));
          fs.writeFileSync('/tmp/tecnosoft-target.txt', String(chosen.idInteracao || '').trim());
          console.log('TECNOSOFT_TARGET='+chosen.idInteracao);
          console.log('TECNOSOFT_PREVIOUS_STATUS='+chosen.statusAuditoria);
          NODE

      - name: Generate safe Tecnosoft SDR preview
        id: preview
        shell: bash
        run: |
          set -uo pipefail
          TOKEN="$(cat /tmp/google_access_token)"
          TARGET="$(cat /tmp/tecnosoft-target.txt)"
          BASE="https://script.google.com/macros/s/AKfycbz9guo1cK-9T5Hdy_RjHt5yn0JuRjY2b37IlqJ9xPdHC47mL_jbliR5TaTK94Hh3SUQEA/exec"
          encoded="$(TARGET="$TARGET" node -e "process.stdout.write(encodeURIComponent(process.env.TARGET))")"
          code="$(curl -sS --max-time 420 --location-trusted --oauth2-bearer "$TOKEN" -o /tmp/tecnosoft-preview.txt -w '%{http_code}' "$BASE?ops_audit_preview=1&transcript=$encoded" || true)"
          echo "TECNOSOFT_PREVIEW_HTTP_STATUS=$code"
          node <<'NODE'
          const fs = require('fs');
          const target = JSON.parse(fs.readFileSync('/tmp/tecnosoft-target.json','utf8'));
          const raw = fs.existsSync('/tmp/tecnosoft-preview.txt') ? fs.readFileSync('/tmp/tecnosoft-preview.txt','utf8').trim() : '';
          let result = {};
          let parseError = '';
          try {
            const first = raw.indexOf('{'), last = raw.lastIndexOf('}');
            if (first < 0 || last < first) throw new Error('Resposta do preview sem JSON.');
            result = JSON.parse(raw.slice(first,last+1));
          } catch (e) {
            parseError = String(e.message || e);
          }
          const ok = result.sucesso === true &&
            String(result.modo || '') === 'PREVIEW_SEM_PUBLICACAO' &&
            result.rdPublicada === false &&
            result.aprovada === false;
          const lines = [
            '## Teste SDR Tecnosoft',
            '',
            '- Interacao: '+String(target.idInteracao || ''),
            '- Data da ligacao: '+String(target.dataInteracao || ''),
            '- Duracao: '+String(target.duracaoSegundos || 0)+'s',
            '- Transcricao existente: '+String(target.transcrita === true),
            '- Status anterior: '+String(target.statusAuditoria || ''),
            '- Preview seguro: '+String(ok),
            '- Auditoria criada: '+String(result.idAuditoria || ''),
            '- Engine: '+String(result.engineVersao || ''),
            '- Status auditoria: '+String(result.status || ''),
            '- Validacao: '+String(result.validacaoStatus || ''),
            '- Gate: '+String(result.gateStatus || ''),
            '- Gate publicavel: '+String(result.gatePublicavel),
            '- Score: '+String(result.score ?? ''),
            '- RD publicada: '+String(result.rdPublicada),
            '- Auditoria aprovada: '+String(result.aprovada),
            '',
            ok ? '**Resultado: fluxo de auditoria SDR executou em preview sem publicar no RD.**'
               : '**Resultado: teste nao concluiu com sucesso.**',
            !ok ? '- Erro: '+String(result.erro || result.gateErro || parseError || 'sem detalhe') : ''
          ].filter(Boolean);
          fs.writeFileSync('/tmp/tecnosoft-preview-report.md', lines.join('\n'));
          fs.writeFileSync('/tmp/tecnosoft-preview-summary.json', JSON.stringify({target,result,ok,parseError},null,2));
          console.log(lines.join('\n'));
          if (!ok) process.exit(1);
          NODE

      - name: Comment Tecnosoft test result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/tecnosoft-preview-report.md ]; then
            gh issue comment 142 --repo "$GITHUB_REPOSITORY" --body-file /tmp/tecnosoft-preview-report.md
          else
            gh issue comment 142 --repo "$GITHUB_REPOSITORY" --body "## Teste SDR Tecnosoft\n\nO runner falhou antes de gerar o relatório."
          fi

      - name: Save Tecnosoft preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdr-tecnosoft-preview-${{ github.run_id }}
          path: |
            /tmp/tecnosoft-status.txt
            /tmp/tecnosoft-target.json
            /tmp/tecnosoft-preview.txt
            /tmp/tecnosoft-preview-summary.json
            /tmp/tecnosoft-preview-report.md
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup authentication
        if: always()
        run: rm -f "$HOME/.clasprc.json" /tmp/google_access_token /tmp/clasp-versions.txt

