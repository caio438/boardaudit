name: Release approved BoardAudit PR from chat

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: boardaudit-chat-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{ github.event.issue.pull_request &&
          github.event.comment.body == '/release-boardaudit' &&
          (github.event.comment.author_association == 'OWNER' ||
           github.event.comment.user.login == 'caio438') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate pull request and exact CI revision
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
          head_repo="$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name')"
          base_ref="$(printf '%s' "$pr_json" | jq -r '.base.ref')"
          draft="$(printf '%s' "$pr_json" | jq -r '.draft')"
          state="$(printf '%s' "$pr_json" | jq -r '.state')"

          test "$state" = "open"
          test "$draft" = "false"
          test "$base_ref" = "main"
          test "$head_repo" = "$REPO"
          test -n "$head_sha"

          runs_json="$(gh api "repos/$REPO/actions/workflows/validate.yml/runs?event=pull_request&per_page=100")"

          conclusion="$(printf '%s' "$runs_json" | jq -r --arg sha "$head_sha" '
            [.workflow_runs[] | select(.head_sha == $sha)] |
            sort_by(.created_at) |
            last |
            .conclusion // ""
          ')"

          status="$(printf '%s' "$runs_json" | jq -r --arg sha "$head_sha" '
            [.workflow_runs[] | select(.head_sha == $sha)] |
            sort_by(.created_at) |
            last |
            .status // ""
          ')"

          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::Validate Apps Script nao esta verde para o SHA exato $head_sha."
            exit 1
          fi

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Squash merge exact validated head
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.guard.outputs.head_sha }}
        run: |
          set -euo pipefail

          response="$(gh api \
            --method PUT \
            "repos/$REPO/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA")"

          merged="$(printf '%s' "$response" | jq -r '.merged')"
          message="$(printf '%s' "$response" | jq -r '.message // ""')"

          test "$merged" = "true" || {
            echo "::error::GitHub recusou o merge: $message"
            exit 1
          }

          merge_sha="$(printf '%s' "$response" | jq -r '.sha // ""')"
          test -n "$merge_sha"

          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact main validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$MERGE_SHA"

          gh api \
            --method POST \
            "repos/$REPO/actions/workflows/validate.yml/dispatches" \
            -f ref=main \
            -f "inputs[expected_sha]=$MERGE_SHA"

      - name: Wait for exact main validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            runs_json="$(gh api "repos/$REPO/actions/workflows/validate.yml/runs?event=workflow_dispatch&branch=main&per_page=50")"

            status="$(printf '%s' "$runs_json" | jq -r --arg sha "$MERGE_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)] |
              sort_by(.created_at) |
              last |
              .status // ""
            ')"

            conclusion="$(printf '%s' "$runs_json" | jq -r --arg sha "$MERGE_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)] |
              sort_by(.created_at) |
              last |
              .conclusion // ""
            ')"

            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "::error::Timeout aguardando Validate Apps Script."
              exit 1
            fi

            sleep 5
          done

      - name: Dispatch exact production deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$MERGE_SHA"

          gh api \
            --method POST \
            "repos/$REPO/actions/workflows/deploy-apps-script-auto.yml/dispatches" \
            -f ref=main \
            -f "inputs[expected_sha]=$MERGE_SHA"

      - name: Confirm release command
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            "repos/$REPO/issues/$PR_NUMBER/comments" \
            -f body="Release aceito: PR incorporado via squash, main validada no SHA exato e deploy de producao disparado para a mesma revisao."
