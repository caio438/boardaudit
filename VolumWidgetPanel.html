<!doctype html><html lang="pt-BR"><head><base target="_top"><meta charset="utf-8">
<style>
:root{--ink:#13213c;--muted:#64748b;--line:#e5eaf2;--violet:#5836be;--ok:#087a52;--warn:#aa5600;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:var(--ink);font:14px Arial,sans-serif}.shell{padding:16px}.brand{font-weight:800;letter-spacing:.13em;color:var(--violet);font-size:16px}.eyebrow{font-size:11px;color:var(--muted);margin-top:3px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}.hero{border-left:4px solid var(--warn);background:#fff8ee}.hero strong{display:block;font-size:15px;line-height:1.3}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.pill{font-size:11px;font-weight:700;border-radius:99px;padding:5px 8px;background:#eef2ff;color:#4338ca}.risk-ALTO{background:#fff0ef;color:var(--danger)}.risk-MÉDIO{background:#fff7e6;color:var(--warn)}.risk-BAIXO{background:#ecfdf5;color:var(--ok)}h2{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}p{margin:0;line-height:1.42}.list{margin:0;padding:0;list-style:none}.list li{padding:8px 0;border-top:1px solid var(--line);line-height:1.35}.list li:first-child{border-top:0}.status{display:inline-block;font-size:10px;font-weight:800;margin-right:7px}.OK{color:var(--ok)}.PENDENTE{color:var(--danger)}.detail{display:block;color:var(--muted);font-size:12px;margin:3px 0 0 0}.quote{background:#f8f6ff;border-radius:8px;padding:10px;font-size:13px;line-height:1.42}.evidence time{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}button{width:100%;border:0;border-radius:8px;background:var(--violet);color:#fff;padding:11px;font-weight:bold;margin-top:16px;cursor:pointer}details summary{cursor:pointer;color:var(--violet);font-weight:bold}.empty{color:var(--muted)}
</style></head><body><main class="shell"><div class="brand">VOLUM INTELLIGENCE</div><div class="eyebrow">Leitura Sales Ops · somente leitura</div><div id="card" class="card">Lendo a negociação…</div></main>
<script>const dealId=<?= JSON.stringify(dealId) ?>;
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function date(v){try{return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(v));}catch(e){return esc(v);}}
function checklist(items){return '<ul class="list">'+(items||[]).map(x=>'<li><span class="status '+esc(x.status)+'">'+(x.status==='OK'?'✓':'●')+' '+esc(x.status)+'</span><b>'+esc(x.titulo)+'</b><span class="detail">'+esc(x.detalhe)+'</span></li>').join('')+'</ul>';}
function render(d){const ev=(d.evidencias||[]).map(x=>'<li class="evidence"><time>'+date(x.data)+' · '+esc(x.fonte)+'</time>'+esc(x.texto)+'</li>').join('')||'<li class="empty">Nenhuma evidência decisiva encontrada.</li>';const sum=(d.resumoExecutivo||[]).map(x=>'<li>'+esc(x)+'</li>').join('');const msg=d.mensagemSugerida?'<h2>Mensagem sugerida</h2><div class="quote">'+esc(d.mensagemSugerida)+'</div>':'';const s=d.evidenciasResumo||{};document.getElementById('card').innerHTML='<section class="hero"><strong>'+esc(d.status)+'</strong><div class="meta"><span class="pill risk-'+esc(d.risco)+'">Risco '+esc(d.risco)+'</span><span class="pill">Etapa RD: '+esc((d.negociacao||{}).etapaAtualNome||'—')+'</span><span class="pill">Agente: '+esc(d.agenteAtual||'—')+'</span></div></section><h2>Leitura executiva</h2><ul class="list">'+sum+'</ul><h2>Decisão recomendada</h2><p><b>'+esc(d.proximaAcao)+'</b></p><h2>Regra de decisão</h2><p>'+esc(d.regraDeDecisao)+'</p>'+msg+'<h2>Compliance do processo</h2>'+checklist(d.compliance)+'<h2>Qualificação comercial</h2>'+checklist(d.qualificacao)+'<details><summary>Evidências e cobertura</summary><div class="eyebrow" style="margin:10px 0">Atividades: '+esc(s.atividades)+' · Ligações comprovadas: '+esc(s.ligacoesComprovadas)+' · Não atendeu: '+esc(s.registrosNaoAtendeu)+' · Tarefas em lote: '+(s.tarefasEmLote?'sim':'não')+'</div><ul class="list">'+ev+'</ul></details><button onclick="audit()">Atualizar auditoria</button>'; }
function audit(){document.getElementById('card').textContent='Atualizando…';google.script.run.withSuccessHandler(render).withFailureHandler(e=>{document.getElementById('card').textContent=(e&&e.message)||'Falha na auditoria.';}).VOLUM_WIDGET_AUDITAR_SESSAO(dealId,true);}
audit();</script></body></html>
