<!doctype html><html lang="pt-BR"><head><base target="_top"><meta charset="utf-8">
<style>body{margin:0;padding:16px;background:#f8fafc;color:#111827;font:14px Arial}.brand{font-weight:800;letter-spacing:.12em;color:#5b31b6}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-top:14px}.status{border-left:3px solid #b45309;background:#fff7ed;padding:9px;margin:12px 0;font-weight:bold}h2{font-size:12px;text-transform:uppercase;color:#64748b;margin:18px 0 7px}ul{padding-left:18px}button{border:0;border-radius:8px;background:#5b31b6;color:white;padding:10px;width:100%;font-weight:bold}</style></head>
<body><div class="brand">VOLUM INTELLIGENCE</div><div id="card" class="card">Lendo a negociação…</div>
<script>const dealId=<?= JSON.stringify(dealId) ?>;
function esc(value){return String(value||'').replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];});}
function list(values,empty){return (values||[]).map(function(value){return '<li>'+esc(value)+'</li>';}).join('')||'<li>'+esc(empty)+'</li>';}
function render(data){const ev=(data.evidencias||[]).map(function(item){return '<li>'+[item.data,item.texto].filter(Boolean).map(esc).join(' — ')+'</li>';}).join('')||'<li>Sem evidências textuais</li>';const bl=list(data.bloqueiosDeAvanco,'Sem bloqueios');document.getElementById('card').innerHTML='<div class="status">'+esc(String(data.status||'SEM CLASSIFICAÇÃO').replaceAll('_',' '))+'</div><b>Agente atual: '+esc(data.agenteAtual||'—')+'</b><h2>Próxima melhor ação</h2><p>'+esc(data.proximaAcao||'—')+'</p><h2>Evidências</h2><ul>'+ev+'</ul><h2>Pendências</h2><ul>'+bl+'</ul><button onclick="audit()">Atualizar auditoria</button>';}
function audit(){document.getElementById('card').textContent='Atualizando…';google.script.run.withSuccessHandler(render).withFailureHandler(function(e){document.getElementById('card').textContent=esc(e.message)||'Falha na auditoria.';}).VOLUM_WIDGET_AUDITAR_SESSAO(dealId,true);}
audit();</script></body></html>
