<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>VOLUM Intelligence · Sales Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080911;--panel:#11121f;--panel2:#18192b;--line:#2c2c40;--ink:#f5f3fb;--muted:#a09fb8;--low:#777991;--violet:#a277ff;--violet2:#c2aaff;--teal:#64dcb9;--yellow:#f4c67f;--red:#ff9692}
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 Geist,Inter,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}
.shell{width:100%;min-width:0;min-height:100vh;max-width:850px;margin:0 auto;padding:0 15px 22px;overflow-x:clip}#card,section{min-width:0}
.topbar{display:flex;align-items:center;gap:9px;padding:18px 0;border-bottom:1px solid var(--line)}
.logo{display:grid;place-items:center;background:linear-gradient(135deg,#ad86ff,#603bdc);height:34px;width:34px;border-radius:10px;color:#fff;font:700 22px/1 "Space Grotesk",sans-serif;letter-spacing:-.07em;box-shadow:0 0 25px #7644de44}
.brand{display:flex;flex-direction:column;line-height:1.1;gap:4px;flex:1}
.brand strong{font:700 15px "Space Grotesk",sans-serif;letter-spacing:.095em}
.brand small{font:500 9px "Geist Mono",monospace;letter-spacing:.17em;color:var(--violet2)}
.private{font:500 9px "Geist Mono",monospace;color:var(--muted);border:1px solid var(--line);padding:6px;border-radius:7px;white-space:nowrap}
.private i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);margin-right:5px}
.eyebrow,.kicker{font:500 10px/1.5 "Geist Mono",monospace;letter-spacing:.09em;color:var(--violet2);text-transform:uppercase}
.intro{padding:21px 0 12px}
.intro h1{font:700 clamp(21px,5vw,27px)/1.18 "Space Grotesk",sans-serif;letter-spacing:-.03em;margin:6px 0 8px;overflow-wrap:anywhere}
.lede{color:var(--muted);font-size:12px;margin:0}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:13px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:6px;background:#1c1c30;border:1px solid #35334d;color:#dcd4f0;font-size:10px;line-height:1.3}
.chip .dot{width:6px;height:6px;background:var(--violet);border-radius:50%}
.notice{padding:11px 13px;background:linear-gradient(90deg,#282143,#131322);border:1px solid #463565;border-radius:10px;color:#e7ddff;font-size:11px;line-height:1.5;margin:13px 0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
.kpi{min-height:83px;background:linear-gradient(145deg,#1c1b2c,#10111d);border:1px solid var(--line);border-radius:11px;padding:11px 10px}
.kpi strong{font:700 24px/1.2 "Space Grotesk",sans-serif;letter-spacing:-.04em;display:block}
.kpi small{color:var(--muted);font-size:10px;display:block;margin-top:5px}
.kpi em{font:9px "Geist Mono",monospace;color:var(--low);font-style:normal}
.kpi.alert strong{color:var(--red)}.kpi.proof strong{color:var(--teal)}.kpi.unknown strong{color:var(--violet2)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:20px -2px 15px;scrollbar-width:thin}
.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:11px;font-weight:600;padding:11px 10px;white-space:nowrap;flex:1}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--violet)}
.tab:focus-visible,.filter:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #c2aaff;outline-offset:2px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:19px 0 10px}
.section-head h2{margin:0;font:700 15px "Space Grotesk",sans-serif}
.section-head small{font:10px "Geist Mono",monospace;color:var(--low)}
.glass{background:linear-gradient(145deg,#181829,#10111e);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.hero{background:radial-gradient(circle at top right,#53347e55,transparent 50%),linear-gradient(140deg,#251a36,#10111e);border:1px solid #4a356a;border-radius:13px;padding:17px 16px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#9057ff,#c6b0ff,transparent)}
.hero h2{font:700 19px/1.35 "Space Grotesk",sans-serif;letter-spacing:-.025em;margin:10px 0}
.hero p{color:#d4cbe4;font-size:11px;margin:7px 0 0}
.hero .next{background:#b18bff;border:0;border-radius:8px;color:#1a1026;font-weight:700;text-align:left;padding:11px 12px;display:block;width:100%;margin-top:13px}
.hero .next:hover{background:#c6a7ff}
.status-tag{display:inline-flex;vertical-align:middle;align-items:center;justify-content:flex-end;max-width:48%;padding:4px 7px;border-radius:5px;font:600 9px/1.2 "Geist Mono",monospace;letter-spacing:.01em;text-transform:uppercase;text-align:right;background:#292338;color:#d1b6ff;border:1px solid #44375c;white-space:normal;overflow-wrap:anywhere}
.state-ATENCAO,.risk-ALTO{background:#3e232a;border-color:#6a3e48;color:#ffb6ad}
.state-SEM_EVIDENCIA,.risk-MEDIO{background:#3d2d1d;border-color:#66503a;color:#ffcd88}
.state-EVIDENCIADO,.state-CONSULTADA,.state-OK{background:#1c3a30;border-color:#2e6554;color:#76e2be}
.state-INDICIO,.state-PARCIAL{background:#2d2447;border-color:#4d4082;color:#c5adff}
.state-NAO_VERIFICAVEL,.state-NAO_APLICAVEL,.risk-NAO{background:#252637;border-color:#3a3c4f;color:#b4b3c6}
.risk-MÉDIO{background:#3d2d1d;border-color:#66503a;color:#ffcd88}
.risk-NÃO{background:#252637;border-color:#3a3c4f;color:#b4b3c6}
.stack{list-style:none;padding:0;margin:0}
.stack li{border-top:1px solid #2b2c3d;padding:12px 0;font-size:12px;color:#d9d6e8}
.stack li:first-child{border:0;padding-top:0}.stack li:last-child{padding-bottom:0}
.muted{color:var(--muted);font-size:11px;line-height:1.55}
.small{color:var(--low);font-size:10px;line-height:1.5}
.action-list{display:grid;gap:8px}
.action{background:#171827;border:1px solid var(--line);border-radius:10px;padding:13px}
.action h3{font-size:12px;font-weight:600;line-height:1.45;margin:9px 0 7px}
.action p{font-size:11px;color:var(--muted);margin:5px 0}
.action .done{border-top:1px dashed #3a3b4d;padding-top:8px;color:#c6bdd7}
.filters{display:flex;gap:5px;overflow-x:auto;scrollbar-width:thin;margin:5px 0 13px;padding:4px 1px}
.filter{border:1px solid #37384f;border-radius:6px;background:#171827;color:#b8b6cb;padding:7px 9px;white-space:nowrap;font-size:10px}
.filter.selected{background:#322541;color:#edddff;border-color:#8a60d4}
.group{background:#131522;border:1px solid var(--line);border-radius:11px;margin:10px 0;overflow:hidden}
.group>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px}
.group>summary::-webkit-details-marker{display:none}
.group>summary:after{content:"+";font-size:18px;color:var(--violet2)}
.group[open]>summary:after{content:"−"}
.group>summary strong{font:600 13px "Space Grotesk",sans-serif}
.group>summary small{font:10px "Geist Mono",monospace;color:var(--muted)}
.group-body{padding:0 12px 12px}
.validation{border-top:1px solid #2d2e40;padding:12px 2px}
.validation-head{display:flex;align-items:start;justify-content:space-between;gap:8px}
.validation h3{min-width:0;margin:0 0 6px;font-size:12px;line-height:1.4;font-weight:600;overflow-wrap:anywhere}
.validation p{margin:6px 0;font-size:11px;color:var(--muted)}
.validation .source{color:var(--low);font:10px/1.4 "Geist Mono",monospace;margin-top:6px}
.to-do{font-size:11px;color:#dbcaff;background:#251d37;border-left:2px solid #9a73e9;border-radius:0 6px 6px 0;padding:9px;margin-top:10px}
.proof-note{padding:9px;background:#1b1b2e;border-radius:7px;color:#b9b4ce;font-size:10px;overflow-wrap:anywhere;margin-top:7px}
.countbar{color:#a3a1b6;font-size:11px;margin:9px 0 17px}
.subdetail{border:1px solid var(--line);border-radius:10px;padding:13px;background:#151625;margin:10px 0}
.subdetail summary{color:#d8c8ff;cursor:pointer;font-weight:600}
.evidence time{display:block;color:#a1a0b6;font:10px "Geist Mono",monospace;margin-bottom:4px}
.quote{white-space:pre-wrap;overflow-wrap:anywhere;border-radius:9px;background:#231d35;border:1px solid #42365a;color:#e4d9fc;padding:12px;font-size:11px}
.warn{color:var(--yellow)}.error{background:#32202b;border:1px solid #723d52;padding:15px;border-radius:11px;color:#ffccd1;font-size:12px}
.loading{padding:26px 6px;color:var(--muted);font-size:12px}
.loading:before{content:"";display:inline-block;background:var(--violet);width:9px;height:9px;border-radius:50%;margin-right:9px;box-shadow:0 0 18px #8955fc}
.refresh-wrap{position:static;margin:18px 0 0;padding:13px 0 4px;background:var(--bg);border-top:1px solid #292b3d}
.refresh{border:1px solid #a38add;background:#a68aff;color:#171022;width:100%;font-weight:700;border-radius:9px;padding:12px}
.refresh:hover{background:#c2aaff}.refresh:disabled{opacity:.6;cursor:default}
.footer{padding:12px 0 18px;text-align:center;font:9px "Geist Mono",monospace;letter-spacing:.03em;color:#7d7d99}
@media(max-width:380px){.shell{padding:0 11px 18px}.brand strong{font-size:13px}.private{font-size:8px}.tab{padding:10px 8px;font-size:10px}.kpi{padding:10px 7px}.kpi strong{font-size:21px}.chip{font-size:9px}}
@media(prefers-reduced-motion:no-preference){.hero,.glass,.kpi,.action{transition:border-color .16s ease}.action:hover{border-color:#494061}.refresh{transition:background .16s ease}}

/* A barra nativa do Chrome ja identifica o produto: no side panel, apenas conteudo. */
.topbar{display:none}
.volum-embedded .topbar{display:none}
.shell{padding-top:0}
.intro{padding-top:4px}
.volum-embedded .shell{padding-top:0}
.volum-embedded .intro{padding-top:4px}
.volum-embedded .footer{display:none}
.operation-fact{padding:10px 0;border-top:1px solid var(--line)}
.operation-fact:first-child{border-top:0}
.operation-fact strong{font-size:10px;letter-spacing:.06em;color:var(--violet2)}
.operation-fact p{margin:5px 0;color:var(--ink)}
.operation-action{padding:12px;margin:9px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.operation-action h3{font-size:13px;line-height:1.4;margin:7px 0}
.operation-action p{color:var(--muted);margin:7px 0}
.operation-action .done{color:var(--teal);font-size:11px}
.state-SEM_REGISTRO{background:#3b2532;color:#ffafbf;border-color:#62384b}

/* Plano de Otimização: uma linha recolhida por critério, sem cartões empilhados. */
.criteria-section{margin:14px 0}
.criteria-section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:15px 0 9px}
.criteria-section-head h3{font:600 13px "Space Grotesk",sans-serif;margin:0}
.criteria-section-head small{font:10px "Geist Mono",monospace;color:var(--muted)}
.criteria-list{display:grid;gap:7px}
.criteria-tile{border:1px solid #343349;background:#151522;border-radius:9px;overflow:hidden}
.criteria-tile[open]{border-color:#514467;background:#191729}
.criteria-tile summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px;padding:12px;min-height:46px}
.criteria-tile summary::-webkit-details-marker{display:none}
.criteria-tile summary:focus-visible{outline:2px solid var(--violet2);outline-offset:-2px}
.criteria-tile summary .criterion-name{flex:1;min-width:0;color:#f2ecfb;font:600 12px/1.35 "Space Grotesk",sans-serif;overflow-wrap:anywhere}
.criteria-tile summary .criterion-chevron{font-size:16px;line-height:1;color:#9f95b4;transition:transform .15s}
.criteria-tile[open] summary .criterion-chevron{transform:rotate(90deg)}
.criteria-light{display:inline-grid;place-items:center;flex-shrink:0;border:1px solid;border-radius:50%;width:17px;height:17px;font:700 11px/1 "Geist Mono",monospace}
.criteria-light.green{color:#64dcb9;background:#153e30;border-color:#327f68}
.criteria-light.red{color:#ffa09d;background:#43232b;border-color:#95545c}
.criteria-light.yellow{color:#f4c67f;background:#41341c;border-color:#927643}
.criteria-light.na{color:#828198;background:#252637;border-color:#444557}
.criteria-detail{padding:0 13px 13px;border-top:1px solid #343349;font-size:11px;line-height:1.5}
.criteria-detail p{margin:8px 0;color:#c7c3da;overflow-wrap:anywhere}
.criteria-detail .criterion-rule{padding:9px 10px;background:#202035;border-radius:6px;color:#e8dcf7}
.criteria-detail .criterion-proof{padding:9px 10px;background:#13251f;border:1px solid #35594a;border-radius:7px;color:#c2ebd7}
.criteria-detail .criterion-gap{padding:9px 10px;background:#2a2027;border-left:2px solid #e5a09b;border-radius:0 6px 6px 0;color:#e9c3c1}
.criteria-detail .criterion-note{color:#9b9ab2;font-size:10px}
.criteria-legend{font-size:10px;color:#9998ae;line-height:1.5;margin-top:9px}

/* Cartoes por evidencia: tons discretos e sombra cromatica, sem alterar a nota de compliance. */
.criteria-tile,.validation,.action,.operation-action{position:relative;isolation:isolate;transition:background .18s ease,border-color .18s ease,box-shadow .18s ease}
.criteria-tile{box-shadow:0 7px 18px rgba(0,0,0,.17)}
.criteria-tile.tone-green,.validation.tone-green,.action.tone-green,.operation-action.tone-green{background:linear-gradient(135deg,#182d28,#101d20);border-color:#377461;box-shadow:0 7px 19px rgba(60,211,163,.11),inset 3px 0 #55c7a1}
.criteria-tile.tone-yellow,.validation.tone-yellow,.action.tone-yellow,.operation-action.tone-yellow{background:linear-gradient(135deg,#30271f,#1a1a22);border-color:#806137;box-shadow:0 7px 20px rgba(245,184,92,.11),inset 3px 0 #dfa855}
.criteria-tile.tone-red,.validation.tone-red,.action.tone-red,.operation-action.tone-red{background:linear-gradient(135deg,#35232b,#1d1823);border-color:#99505f;box-shadow:0 7px 20px rgba(255,127,145,.12),inset 3px 0 #e88695}
.criteria-tile.tone-violet,.validation.tone-violet,.action.tone-violet,.operation-action.tone-violet{background:linear-gradient(135deg,#29203b,#171522);border-color:#634b91;box-shadow:0 7px 20px rgba(167,115,250,.12),inset 3px 0 #ad8be8}
.criteria-tile.tone-na,.validation.tone-na,.action.tone-na,.operation-action.tone-na{background:linear-gradient(140deg,#1b1d2a,#121521);border-color:#36384b;box-shadow:0 5px 15px rgba(0,0,0,.13),inset 3px 0 #5b6074}
.criteria-tile[open]{box-shadow:0 10px 26px rgba(0,0,0,.29)}
.validation{border:1px solid #37374e;border-radius:10px;margin:9px 0;padding:13px;background:linear-gradient(140deg,#211c31,#151521)}
.validation:first-child{border-top:1px solid}
.validation .source{margin-top:10px}
.action,.operation-action{margin:9px 0;border-radius:11px}
.action h3,.operation-action h3{color:#f4f0ff}
.action .done,.operation-action .done{border-top:1px dashed rgba(206,195,235,.25);margin-top:9px;padding-top:9px}
@media(prefers-reduced-motion:reduce){.criteria-tile,.validation,.action,.operation-action{transition:none}}
</style>
<meta name="volum-history-nonce" content="<?= historyNonce ?>">
<meta name="volum-cache-scope" content="<?= cacheScope ?>">
</head>
<body>
<main class="shell" id="volum-root" data-deal-id="<?= dealId ?>">
<div id="card" class="loading" role="status">Lendo a negociação e as evidências comerciais…</div>
</main>
<script>
const dealId=document.getElementById("volum-root").dataset.dealId;
const historyNonce=typeof document.querySelector==='function'?
  (document.querySelector('meta[name="volum-history-nonce"]')?.content||''):'';
const embedMode=true;
if(embedMode && document.documentElement && document.documentElement.classList)document.documentElement.classList.add('volum-embedded');
let currentData=null;
let activeTab='visao';
let activeFilter='todos';
const cacheScope=typeof document.querySelector==='function'?
  (document.querySelector('meta[name="volum-cache-scope"]')?.content||''):'';
const CACHE_VERSION='VOLUM_WIDGET_CACHE_051';
const CACHE_RESPONSE_VERSION='0.5.1-RD';
const CACHE_ANALYSIS_REVISION='RD_STAGE_EVIDENCE_V2_20261026';
const CACHE_TTL_MS=60*60*1000;
const cacheStorageKey='volum_cache_051_'+cacheScope+'_'+dealId;
let cacheVisualizada=false,cacheSalvoEm=0,cacheErro='';
let estadoCarga='INIT',historicoReenviar=false,chamadaUsouHistorico=false;
let analiseSeq=0,temporizadorBootstrap=null,temporizadorHistorico=null;
function val(x){return x===null||x===undefined?'':String(x);}
function esc(x){return val(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
function safeClass(x){return val(x).replace(/[^a-zA-ZÀ-ÿ_]/g,'').slice(0,35);}
function display(x){return val(x).replace(/_/g,' ').replace(/NAO /g,'NÃO ').replace(/SEM EVIDENCIA/g,'SEM EVIDÊNCIA');}
function status(s){return '<span class="status-tag state-'+safeClass(s)+'">'+esc(display(s||'PENDENTE'))+'</span>';}
function humanDate(x){if(!x)return 'Sem data';const date=new Date(x);return Number.isNaN(date.getTime())?esc(x):new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(date);}
function section(title,extra){return '<div class="section-head"><h2>'+esc(title)+'</h2><small>'+esc(extra||'')+'</small></div>';}
function itemTone(x){
  const s=String(x?.status||'').toUpperCase(),conf=String(x?.conformidade||'').toUpperCase();
  if(conf==='NAO_CONFORME'||s==='DESVIO_CONFIRMADO')return 'red';
  if(s==='NAO_APLICAVEL')return 'na';
  if(s==='SEM_REGISTRO'||s==='SEM_EVIDENCIA'||s==='ATENCAO')return 'yellow';
  if(s==='EVIDENCIADO'||s==='CONFORME'||s==='OK')return 'green';
  return 'violet';
}
function itemValidation(x){
  x=x||{};
  return '<div class="validation tone-'+itemTone(x)+'"><div class="validation-head"><h3>'+
    esc(x.titulo||x.title||x.id||'Critério sem título')+'</h3>'+status(x.status)+'</div>'+
    '<p>'+esc(x.detalhe||'Sem explicação disponível para este critério.')+'</p>'+
    (x.evidencia?'<div class="proof-note">'+esc(x.evidencia)+'</div>':'')+
    (x.acao?'<div class="to-do"><b>Próxima validação:</b> '+esc(x.acao)+'</div>':'')+
    '<div class="source">Fonte: '+esc(x.fonte||x.referencia||'Dados consultados')+'</div></div>';
}
function itemsWithLegacy(items){return (items||[]).map(function(x){return itemValidation(x)}).join('')||'<p class="muted">Nenhum critério disponível nesta leitura.</p>';}
// Critérios oficiais: CONFORME só quando a prova satisfaz a regra inteira.
// Um indicio de atividade continua amarelo, mesmo que o banco marque
// "EVIDENCIADO" apenas porque um registro existe.
const CRITERIOS_VERDE={
  cadencia:'Sequência de tentativas efetivamente registradas por dia útil, canal e resultado, respeitando a versão da régua e a pausa após resposta/agendamento.',
  voip:'Registro efetivo de ligação pela telefonia/VoIP associado ao negócio e ao SDR, não somente tarefa de ligação criada ou concluída.',
  pitch:'Transcrição ou gravação atribuída ao SDR demonstrando as perguntas obrigatórias e a condução do pitch vigente.',
  no_show:'No-show registrado e tentativas de reagendamento realizadas nos prazos e canais da cadência correspondente; caso não exista no-show, não se aplica.',
  handoff:'Nota de passagem com SDR, Closer, LMV validado, segmento, dor, resumo, responsável e data/link do compromisso.',
  registros:'Cada tentativa concluída tem resultado documentado, canal, data e próximo passo ou motivo de encerramento.',
  tarefas:'Tarefas com responsável, vencimento e desfecho; nenhuma tarefa vencida sem justificativa e execução dentro do prazo estabelecido.',
  segmento:'Segmento preenchido com valor específico antes da passagem para agenda.',
  lmv:'LMV/faturamento validado com o comprador e valor ou faixa registrados antes do avanço.',
  qualificacao:'Necessidade, motivação e contexto da dor documentados e úteis ao Closer.',
  agenda:'Data, horário, participantes, Closer e acesso da reunião registrados, com compromisso aceito.',
  confirmacao:'Resposta positiva do comprador ou aceite do convite com data; apenas enviar o convite não comprova confirmação.',
  valor_reuniao:'A gravação/transcrição demonstra que o SDR explicou concretamente o valor da reunião.',
  horarios:'A gravação/transcrição comprova a oferta das duas opções de horário previstas no pitch.',
  primeiro_registro:'A primeira tentativa real está identificada e dentro do SLA aprovado, com calendário e feriados corretos; criar tarefa não basta.',
  resultado_ligacao:'Para cada ligação realizada, existe resultado ou outcome registrado na negociação.',
  gravacao:'Link de gravação real, recuperável e relacionado à reunião efetiva, registrado na anotação ou formalização.',

function criterionLight(item){
  const raw=String(item.conformidade||item.complianceEstado||'').toUpperCase();
  if(raw==='CONFORME')return {cls:'green',label:'Conforme',glyph:'✓'};
  if(raw==='NAO_CONFORME'||raw==='DESVIO_CONFIRMADO')return {cls:'red',label:'Desvio confirmado',glyph:'!'};
  if(raw==='NAO_APLICAVEL'||String(item.status||'').toUpperCase()==='NAO_APLICAVEL')
    return {cls:'na',label:'Não aplicável',glyph:'—'};
  // Nunca converter EVIDENCIADO em aprovação integral: fonte pode provar
  // apenas uma parte do checklist.
  return {cls:'yellow',label:'Verificação parcial ou pendente',glyph:'?'};
}
function criterionCard(item){

    const role=x.funcao==='NAO_COMPROVADO'?'Função não confirmada':'Função '+x.funcao+' (campo do board)';
    const date=humanDate(x.data);
    const txt='Duração informada: '+Number(x.duracaoSegundos||0)+'s. Gravação referenciada: '+
      (x.gravacaoReferencia?'sim':'não')+'. Transcrição: '+
      (x.statusTranscricao||'não informada')+'. Não confirma diálogo.';
    return {titulo:x.tipo+' · '+date,status:x.funcao==='NAO_COMPROVADO'?'NAO_VERIFICAVEL':'INDICIO',
      detalhe:txt,fonte:x.fonte+' · '+role,
      evidencia:x.responsavelRegistrado?'Responsável cadastrado: '+x.responsavelRegistrado:''};
  }),false);
  return html;
}
function documentEvidence(d){const x=d.evidenciasDocumentais||{};const files=(x.nomesArquivos||[]);let html=section('E-mail e arquivos','Rastreabilidade comercial');html+='<div class="glass"><ul class="stack">'+
 '<li>E-mail de formalização: <b>'+ (x.emailFormalizacao?'indício localizado':'não localizado') +'</b>.</li>'+
 '<li>Referência de gravação/reunião realizada: <b>'+ (x.emailGravacao?'indício localizado':'não localizada') +'</b>.</li>'+
 '<li>Próxima reunião/convite: <b>'+ (x.emailProximaReuniao?'indício localizado':'não localizado') +'</b>.</li>'+
 '<li>PDFs no RD: <b>'+Number(x.pdfs||0)+'</b> · PDFs compatíveis com proposta: <b>'+Number(x.propostaPdf||0)+'</b>.</li></ul>'+
 '<p class="small">E-mail, link e arquivo são rastros operacionais: não comprovam entrega, leitura, reunião realizada ou aceite.</p></div>';
 if(files.length)html+=group('Arquivos consultados',files.map(function(n){return {titulo:n,status:'INDICIO',detalhe:'Metadado de arquivo vinculado à negociação; conteúdo não foi lido.',fonte:'RD · arquivos'};}),false);return html;}
function proof(d){let html=evidenciasRoteadas(d)+operationalAudit(d)+section('Cobertura e rastreabilidade','Auditoria somente leitura')+group('Fontes consultadas',d.fontesCobertura||[],true);html+=documentEvidence(d);
html+=boardEvidence(d);
html+=section('Compliance do processo','Verificações existentes')+group('Sinais operacionais',d.compliance||[],false);
html+=section('Qualificação registrada','LMV, dor e contexto')+group('Qualificação',d.qualificacao||[],false);
const evidence=d.evidencias||[];
html+=section('Últimas evidências','Anotações acessíveis')+'<div class="glass"><ul class="stack">'+(evidence.map(function(x){return '<li class="evidence"><time>'+humanDate(x.data)+' · '+esc(x.fonte)+'</time>'+esc(x.texto)+'</li>'}).join('')||'<li class="muted">Nenhuma evidência textual disponível.</li>')+'</ul></div>';
html+='<div class="glass"><div class="eyebrow">LIMITES DE INTERPRETAÇÃO</div><ul class="stack">'+(d.limites||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
return html;}
function render(d){currentData=d||{};const info=currentData.negociacao||{};const header='<div class="intro"><span class="eyebrow">SALES OPS / '+esc(currentData.versao||'V4')+'</span><h1>'+esc(info.nome||'Negociação RD')+'</h1><p class="lede">Diagnóstico comercial orientado por evidências, em tempo de leitura.</p><div class="meta"><span class="chip"><span class="dot"></span>'+esc(info.etapaAtualNome||'Etapa não informada')+'</span><span class="chip">'+esc(currentData.agenteAtual||'Agente não mapeado')+'</span><span class="chip">Somente leitura</span></div></div>';
const notice=currentData.diagnosticoRdOperacional?
'<div class="notice">'+esc(currentData.diagnosticoRdOperacional.ativo?
 'Leitura de execução do Histórico RD, com origem, autor e etapa. Não confunda abertura de WhatsApp, tarefa concluída ou convite com conversa realizada.':
 'Aguardando História visual completa do RD para evitar recomendações sem contexto.')+'</div>':
'<div class="notice">Não atribuímos uma nota de compliance quando não há fontes e regras suficientes. A widget diferencia fato registrado, indício e dado não verificável.</div>';
let body=activeTab==='visao'?overview(currentData):activeTab==='etapasrd'?rdWindows(currentData):activeTab==='lead'?leadAgent(currentData):activeTab==='cadencia'?cadenceAgent(currentData):activeTab==='conexao'?journeyAgent(currentData,'CONEXAO','conexao','Agente CONEXÃO','Canal, qualificação, LMV e handoff'):activeTab==='agenda'?journeyAgent(currentData,'AGENDA','agenda','Agente AGENDA','Convite, confirmação, no-show e recovery'):activeTab==='reuniao'?journeyAgent(currentData,'REUNIAO','reuniao','Agente REUNIÃO','Execução, gravação e continuidade'):activeTab==='inteligencia'?intelligence(currentData):activeTab==='sdr'?sdr(currentData):activeTab==='closer'?closer(currentData):proof(currentData);
document.getElementById('card').innerHTML=header+cacheStatusView()+counter(currentData)+tabs()+(activeTab==='visao'?notice:'')+'<section aria-label="Conteúdo da auditoria">'+body+'</section><div class="refresh-wrap"><button type="button" class="refresh" onclick="audit()">↻ Atualizar auditoria</button></div><footer class="footer">VOLUM INTELLIGENCE · DADOS DO RD / BOARD · USO INTERNO</footer>';}
function changeTab(tab){if(!currentData)return;activeTab=tab;render(currentData);}
function changeFilter(filter){if(!currentData)return;activeFilter=filter;render(currentData);}
let historyFromRd=null;
function cachedEntryValid(e){
  return !!(e&&e.cacheVersion===CACHE_VERSION&&
    e.analysisRevision===CACHE_ANALYSIS_REVISION&&e.scope===cacheScope&&
    e.dealId===dealId&&Number(e.savedAt)>0&&Date.now()-Number(e.savedAt)>=0&&
    Date.now()-Number(e.savedAt)<CACHE_TTL_MS&&
    e.answer?.versao===CACHE_RESPONSE_VERSION&&
    e.answer?.diagnosticoRdOperacional?.ativo===true&&
    e.answer?.trilhaDadosAgentes?.historicoRd?.completo===true);
}
function cacheLocalGet(){
  try{
    if(!cacheScope)return null;
    const raw=window.localStorage?.getItem(cacheStorageKey);
    if(!raw)return null;
    const e=JSON.parse(raw);
    if(cachedEntryValid(e))return e;
    window.localStorage?.removeItem(cacheStorageKey);
  }catch(_ignore){}
  return null;
}
function cacheExtension(op,entry){
  try{
    if(window.top&&window.top!==window&&historyNonce&&cacheScope)
      window.top.postMessage({type:'VOLUM_CACHE_REQUEST',op,dealId,
        nonce:historyNonce,scope:cacheScope,cacheVersion:CACHE_VERSION,
        entry:entry||null},'*');
  }catch(_ignore){}
}
function cacheLocalPut(entry){
  try{if(cacheScope)window.localStorage?.setItem(cacheStorageKey,JSON.stringify(entry));}
  catch(_ignore){}
}
function cacheClear(){
  try{window.localStorage?.removeItem(cacheStorageKey);}catch(_ignore){}
  cacheExtension('CLEAR',null);
}
function cacheUse(entry){
  if(!cachedEntryValid(entry))return false;
  clearTimeout(temporizadorBootstrap);
  clearTimeout(temporizadorHistorico);
  cacheLocalPut(entry);
  estadoCarga='CACHE_HIT';cacheVisualizada=true;cacheSalvoEm=entry.savedAt;cacheErro='';
  render(entry.answer);
  return true;
}
function cacheSave(d){
  if(!cacheScope||!d||d.versao!==CACHE_RESPONSE_VERSION||
     d.diagnosticoRdOperacional?.ativo!==true||
     d.trilhaDadosAgentes?.historicoRd?.completo!==true)return;
  const e={cacheVersion:CACHE_VERSION,analysisRevision:CACHE_ANALYSIS_REVISION,
    scope:cacheScope,dealId,savedAt:Date.now(),answer:d};
  // Limitar o armazenamento de dados comerciais no navegador.
  const encoded=JSON.stringify(e);
  if(encoded.length>450000)return;
  cacheLocalPut(e);cacheExtension('PUT',e);
}
function requestRdHistory(refresh){
  try {
    if(window.top&&window.top!==window)window.top.postMessage({
      type:'VOLUM_REQUEST_RD_UI_HISTORY',dealId:dealId,refresh:refresh===true,nonce:historyNonce
    },'*');
  } catch(_ignore) {}
}
function runAudit(){
  if(estadoCarga==='RUNNING')return;
  if(!/^[0-9a-f]{24}$/i.test(dealId)){
    document.getElementById('card').textContent='Não foi possível identificar a negociação RD. Feche e reabra a widget.';
    return;
  }
  clearTimeout(temporizadorHistorico);
  estadoCarga='RUNNING';chamadaUsouHistorico=historyFromRd?.coverage?.complete===true;
  const seq=++analiseSeq;
  if(!currentData)document.getElementById('card').textContent='Lendo a negociação e as evidências comerciais…';
  else cacheErro='Atualizando a auditoria com as evidências atuais…';
  const rpc=google.script.run.withSuccessHandler(function(d){
    if(seq!==analiseSeq)return;
    estadoCarga='READY';cacheVisualizada=false;cacheSalvoEm=Date.now();cacheErro='';
    render(d);cacheSave(d);
    // Se a primeira leitura precisou de fallback, aplicar o Histórico recebido
    // depois apenas uma vez. Troca de aba nunca aciona esse mecanismo.
    if(historicoReenviar&&historyFromRd?.coverage?.complete===true&&!chamadaUsouHistorico){
      historicoReenviar=false;estadoCarga='WAIT_HISTORY';runAudit();
    }
  }).withFailureHandler(function(e){
    if(seq!==analiseSeq)return;
    estadoCarga='READY';
    cacheErro='Não foi possível atualizar a auditoria. A leitura salva, se existir, permanece visível.';
    if(currentData)render(currentData);
    else document.getElementById('card').innerHTML=
      '<div class="error"><strong>Não foi possível concluir a leitura.</strong><p>'+
        esc(e?.message||'Falha temporária na auditoria.')+
        '</p><button type="button" class="refresh" onclick="audit()">Tentar novamente</button></div>';
  });
  if(historyFromRd)rpc.VOLUM_WIDGET_AUDITAR_SESSAO_COM_HISTORICO(dealId,historyFromRd,true);
  else rpc.VOLUM_WIDGET_AUDITAR_SESSAO(dealId,true);
}
function aguardarHistorico(refresh){
  estadoCarga='WAIT_HISTORY';cacheErro='';
  if(refresh)historyFromRd=null;
  requestRdHistory(refresh===true);
  clearTimeout(temporizadorHistorico);
  // Se a extensão estiver ausente, nunca deixar o painel eternamente vazio.
  temporizadorHistorico=setTimeout(function(){
    if(estadoCarga==='WAIT_HISTORY')runAudit();
  },14000);
  if(historyFromRd)runAudit();
}
function iniciarSemCache(){
  if(estadoCarga!=='WAIT_CACHE')return;
  clearTimeout(temporizadorBootstrap);
  aguardarHistorico(false);
}
function audit(){
  // Ação explícita do usuário sempre invalida e relê. Resultado pendente de
  // chamada anterior não pode sobrescrever o novo pedido.
  analiseSeq++;
  historicoReenviar=false;cacheVisualizada=false;cacheSalvoEm=0;
  cacheClear();
  aguardarHistorico(true);
}
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('message',function(event){
  const m=event&&event.data||{};
  if(!(/^(?:chrome-extension:\/\/[a-z0-9]+|https:\/\/crm\.rdstation\.com)$/i.test(
      String(event.origin||'')))||event.source!==window.top)return;
  if(m.dealId!==dealId||m.nonce!==historyNonce)return;
  if(m.type==='VOLUM_CACHE_RESPONSE'&&m.scope===cacheScope&&
     m.cacheVersion===CACHE_VERSION&&m.op==='GET'){
    if(estadoCarga!=='WAIT_CACHE')return;
    if(!cacheUse(m.entry))iniciarSemCache();
    return;
  }
  if(m.type!=='VOLUM_RD_UI_HISTORY'||!m.history)return;
  historyFromRd=m.history;
  if(estadoCarga==='WAIT_HISTORY')runAudit();
  else if(estadoCarga==='RUNNING'&&historyFromRd.coverage?.complete===true&&
    !chamadaUsouHistorico)historicoReenviar=true;
});
function bootstrapWidget(){
  if(!/^[0-9a-f]{24}$/i.test(dealId)){
    document.getElementById('card').textContent='Negociação RD inválida.';
    return;
  }
  if(cacheUse(cacheLocalGet()))return;
  estadoCarga='WAIT_CACHE';
  cacheExtension('GET',null);
  temporizadorBootstrap=setTimeout(iniciarSemCache,750);
}
bootstrapWidget();
</script>
